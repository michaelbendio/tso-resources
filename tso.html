// ============================================================
// PERSISTENCE
// ============================================================
// Storage split:
// - localStorage keeps the primary JSON snapshot ("tsoData").
// - IndexedDB keeps binary assets (PDF blobs) under string keys.
// - resource.pdfs stores PDF metadata; resource.pdf remains legacy-compatible.

function persist(){
  // Writes the canonical JSON snapshot used to restore app state on reload.
  if(DEBUG) assertInvariants("persist");
  data.appVersion = APP_VERSION;
  data.lastModified = nowISO();
  localStorage.setItem("tsoData", JSON.stringify(data));
}

function openAssetsDB(){
  // Opens the IndexedDB database used for PDF blob storage/retrieval.
  return new Promise((resolve, reject) => {
    if(typeof indexedDB === "undefined"){
      reject(new Error("Asset storage is unavailable in this browser."));
      return;
    }

    let settled = false;
    const timeoutId = setTimeout(() => {
      if(settled) return;
      settled = true;
      reject(new Error("Asset storage is unavailable right now. Reload the app and try again."));
    }, 4000);

    function finish(fn){
      return value => {
        if(settled) return;
        settled = true;
        clearTimeout(timeoutId);
        fn(value);
      };
    }

    let req;
    try{
      req = indexedDB.open("tsoAssets", 1);
    }catch(err){
      clearTimeout(timeoutId);
      reject(err);
      return;
    }

    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains("files")){
        db.createObjectStore("files");
      }
    };

    req.onsuccess = finish(() => resolve(req.result));
    req.onerror = finish(() => reject(req.error || new Error("Asset storage is unavailable in this browser.")));
    req.onblocked = finish(() => reject(new Error("Asset storage is blocked. Close other tabs and try again.")));
  });
}

async function saveAsset(key, blob){
  // Generic keyed binary write used by higher-level PDF helpers.
  const db = await openAssetsDB();
  const tx = db.transaction("files", "readwrite");
  tx.objectStore("files").put(blob, key);

  return new Promise((resolve, reject) => {
    tx.oncomplete = () => {
      db.close();
      resolve();
    };
    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
    tx.onabort = () => {
      db.close();
      reject(tx.error);
    };
  });
}

async function loadAsset(key){
  // Generic keyed binary read.
  const db = await openAssetsDB();
  const tx = db.transaction("files", "readonly");
  const req = tx.objectStore("files").get(key);

  return new Promise((resolve, reject) => {
    req.onsuccess = () => {
      db.close();
      resolve(req.result);
    };
    req.onerror = () => {
      db.close();
      reject(req.error);
    };
  });
}

async function getAsset(path){
  return loadAsset(path);
}

function ensurePDFBlob(value){
  if(value instanceof Blob){
    return value.type === "application/pdf"
      ? value
      : new Blob([value], { type: "application/pdf" });
  }
  return new Blob([value], { type: "application/pdf" });
}

async function savePDF(key, blob){
  // PDF-specific save wrapper to enforce PDF blob type.
  return saveAsset(key, ensurePDFBlob(blob));
}

async function getPDF(key){
  // Lookup PDF blob by the key/path stored in resource.pdfs[].path.
  return getAsset(key);
}

async function deleteAsset(key){
  const db = await openAssetsDB();
  const tx = db.transaction("files", "readwrite");
  tx.objectStore("files").delete(key);

  return new Promise((resolve, reject) => {
    tx.oncomplete = () => {
      db.close();
      resolve();
    };
    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
    tx.onabort = () => {
      db.close();
      reject(tx.error);
    };
  });
}

async function deletePDF(key){
  return deleteAsset(key);
}

async function openPDF(path){
  // Opens a resource PDF by resolving its key/path into an IndexedDB blob.
  const pdfWindow = window.open("", "_blank");
  if(!pdfWindow){
    alert("Unable to open PDF window. Allow pop-ups and try again.");
    return;
  }
  pdfWindow.document.title = "Loading PDF...";
  pdfWindow.document.body.textContent = "Loading PDF...";
  try{
    const stored = await getPDF(path);
    if(!stored){
      pdfWindow.close();
      alert("PDF not found.");
      return;
    }
    const pdfBlob = ensurePDFBlob(stored);
    const url = URL.createObjectURL(pdfBlob);
    pdfWindow.location = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(err){
    pdfWindow.close();
    alert("Unable to open PDF: " + err.message);
  }
}

async function clearAssets(){
  const db = await openAssetsDB();
  const tx = db.transaction("files", "readwrite");
  tx.objectStore("files").clear();

  return new Promise((resolve, reject) => {
    tx.oncomplete = () => {
      db.close();
      resolve();
    };
    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
    tx.onabort = () => {
      db.close();
      reject(tx.error);
    };
  });
}

function cloneDataObject(value){
  return JSON.parse(JSON.stringify(value || {}));
}

function getValidTimestamp(value){
  const timestamp = Date.parse(String(value || ""));
  return Number.isFinite(timestamp) ? timestamp : null;
}

function objectsDiffer(a, b){
  return JSON.stringify(a || {}) !== JSON.stringify(b || {});
}

function getSeenUpdateIds(){
  try{
    const parsed = JSON.parse(localStorage.getItem(UPDATE_SEEN_STORAGE_KEY) || "[]");
    return new Set(Array.isArray(parsed) ? parsed.map(String) : []);
  }catch(_err){
    return new Set();
  }
}

function saveSeenUpdateIds(seenSet){
  localStorage.setItem(UPDATE_SEEN_STORAGE_KEY, JSON.stringify(Array.from(seenSet)));
}

function normalizeChanges(packageData){
  if(!packageData || typeof packageData !== "object") return;
  const source = Array.isArray(packageData.changes) ? packageData.changes : [];
  const normalized = [];
  const seen = new Set();
  source.forEach((entry, index) => {
    if(!entry || typeof entry !== "object") return;
    const description = String(entry.description || "").trim();
    if(!description) return;
    const type = entry.type === "category" ? "category" : "resource";
    const action = ["added", "updated", "removed"].includes(entry.action) ? entry.action : "updated";
    const timestamp = Date.parse(String(entry.timestamp || "")) ? String(entry.timestamp) : nowISO();
    const id = String(entry.id || `${type}:${entry.targetId || index}:${timestamp}`).trim();
    if(!id || seen.has(id)) return;
    seen.add(id);
    normalized.push({
      id,
      type,
      action,
      targetId: String(entry.targetId || ""),
      targetName: String(entry.targetName || "(Unnamed)").trim() || "(Unnamed)",
      description,
      timestamp,
      categoryIds: Array.isArray(entry.categoryIds) ? entry.categoryIds.map(String) : []
    });
  });
  packageData.changes = normalized;
}

function createChangeEntry(type, action, targetId, targetName, description, options = {}){
  const cleanDescription = String(description || "").trim();
  if(!cleanDescription) return null;
  const timestamp = nowISO();
  return {
    id: `${type || "change"}:${targetId || "unknown"}:${timestamp}:${Math.random().toString(16).slice(2,8)}`,
    type: type === "category" ? "category" : "resource",
    action: ["added", "updated", "removed"].includes(action) ? action : "updated",
    targetId: String(targetId || ""),
    targetName: String(targetName || "(Unnamed)").trim() || "(Unnamed)",
    description: cleanDescription,
    timestamp,
    categoryIds: Array.isArray(options.categoryIds) ? options.categoryIds.map(String) : []
  };
}

function addChangeEntry(changeEntry){
  if(!changeEntry) return;
  normalizeChanges(data);
  data.changes.push(changeEntry);
}

function mergeChanges(localChanges, incomingChanges){
  const merged = [];
  const seen = new Set();
  [localChanges, incomingChanges].forEach(list => {
    (Array.isArray(list) ? list : []).forEach(entry => {
      const id = String(entry && entry.id || "");
      if(!id || seen.has(id)) return;
      seen.add(id);
      merged.push(cloneDataObject(entry));
    });
  });
  return merged;
}

function getRecentChanges(){
  normalizeChanges(data);
  return data.changes.slice().sort((a,b)=>String(b.timestamp||"").localeCompare(String(a.timestamp||"")));
}

function markChangesViewed(changeIds){
  const seen = getSeenUpdateIds();
  (Array.isArray(changeIds) ? changeIds : []).forEach(id => {
    if(id) seen.add(String(id));
  });
  saveSeenUpdateIds(seen);
}

function getChangesForResource(resourceId, { unseenOnly = false } = {}){
  const seen = getSeenUpdateIds();
  return getRecentChanges().filter(entry => {
    return entry.type === "resource" &&
      String(entry.targetId || "") === String(resourceId || "") &&
      (!unseenOnly || !seen.has(String(entry.id)));
  });
}

function getCategoryIdsForChange(entry){
  if(!entry) return [];
  if(Array.isArray(entry.categoryIds) && entry.categoryIds.length) return entry.categoryIds.slice();
  if(entry.type === "category") return entry.targetId ? [String(entry.targetId)] : [];
  const res = data.resources.find(r => String(r && r.id || "") === String(entry.targetId || ""));
  return Array.isArray(res && res.categories) ? res.categories.slice() : [];
}

function getChangesForCategory(categoryId, { unseenOnly = false } = {}){
  const seen = getSeenUpdateIds();
  return getRecentChanges().filter(entry => {
    return getCategoryIdsForChange(entry).includes(categoryId) &&
      (!unseenOnly || !seen.has(String(entry.id)));
  });
}

function formatChangeEntryHTML(entry){
  const dateText = formatDateOnly(entry && entry.timestamp);
  return `<strong>${escapeHTML(entry.targetName || "(Unnamed)")}</strong><div>${escapeHTML(dateText)} · ${escapeHTML(entry.type || "")} · ${escapeHTML(entry.action || "")}</div><div>${escapeHTML(entry.description || "")}</div>`;
}

function chooseMergeObject(localItem, incomingItem){
  if(!localItem && incomingItem) return { item:incomingItem, changed:true };
  if(localItem && !incomingItem) return { item:localItem, changed:false };

  const localTime = getValidTimestamp(localItem.lastModified);
  const incomingTime = getValidTimestamp(incomingItem.lastModified);
  const differs = objectsDiffer(localItem, incomingItem);

  if(localTime !== null && incomingTime !== null){
    return incomingTime > localTime
      ? { item:incomingItem, changed:differs }
      : { item:localItem, changed:false };
  }
  if(localTime === null && incomingTime !== null) return { item:incomingItem, changed:differs };
  if(localTime !== null && incomingTime === null) return { item:localItem, changed:false };
  return differs
    ? { item:incomingItem, changed:true }
    : { item:localItem, changed:false };
}

function mergeItemsById(localItems, incomingItems, options = {}){
  const localList = Array.isArray(localItems) ? localItems : [];
  const incomingList = Array.isArray(incomingItems) ? incomingItems : [];
  const incomingById = new Map(incomingList.map(item => [String(item && item.id || ""), item]).filter(([id]) => id));
  const seen = new Set();
  const merged = [];
  let added = 0;
  let updated = 0;

  localList.forEach(localItem => {
    const id = String(localItem && localItem.id || "");
    if(!id) return;
    const incomingItem = incomingById.get(id);
    const choice = chooseMergeObject(localItem, incomingItem);
    merged.push(cloneDataObject(choice.item));
    seen.add(id);
    if(incomingItem && choice.item === incomingItem && choice.changed){
      updated += 1;
    }
  });

  incomingList.forEach(incomingItem => {
    const id = String(incomingItem && incomingItem.id || "");
    if(!id || seen.has(id)) return;
    merged.push(cloneDataObject(incomingItem));
    seen.add(id);
    added += 1;
  });

  return { merged, added, updated };
}

function normalizePackageData(nextData){
  if(!nextData || typeof nextData !== "object") nextData = {};
  if(!Array.isArray(nextData.categories)) nextData.categories = [];
  if(!Array.isArray(nextData.resources)) nextData.resources = [];
  normalizeDataServicesShape(nextData);
  normalizeDataPDFShape(nextData);
  normalizeDataTagsShape(nextData);
  normalizeDataVerifiedOnShape(nextData);
  normalizeChanges(nextData);
  return nextData;
}

function mergeResourcePackages(localData, incomingData){
  const local = normalizePackageData(cloneDataObject(localData));
  const incoming = normalizePackageData(cloneDataObject(incomingData));
  const categoryMerge = mergeItemsById(local.categories, incoming.categories, { kind:"categories" });
  const resourceMerge = mergeItemsById(local.resources, incoming.resources, { kind:"resources" });
  const mergedData = {
    ...local,
    ...incoming,
    categories: categoryMerge.merged,
    resources: resourceMerge.merged,
    changes: mergeChanges(local.changes, incoming.changes),
    tags: []
  };
  normalizePackageData(mergedData);
  return {
    mergedData,
    summary: {
      categoriesAdded: categoryMerge.added,
      categoriesUpdated: categoryMerge.updated,
      resourcesAdded: resourceMerge.added,
      resourcesUpdated: resourceMerge.updated
    }
  };
}

async function mergeZipAssets(zip, mergedData){
  const pdfKeys = collectPDFPathsFromResources(mergedData.resources);
  const missing = [];

  for(const key of pdfKeys){
    const entry = zip.file(key);
    if(entry && key.toLowerCase().endsWith(".pdf")){
      const blob = await entry.async("blob");
      await savePDF(key, blob);
    }else{
      let existing = null;
      try{
        existing = await getPDF(key);
      }catch(_err){}
      if(!existing) missing.push(key);
    }
  }
  return missing;
}

function applyMergedData(mergedData){
  normalizePackageData(mergedData);
  data = mergedData;
  persist();
  safeRender();
}

async function beginResourcePackageSave(){
  // Request a save target up front so browsers can honor the user gesture.
  const suggestedName = "tso-resource-package.zip";
  if(typeof window.showSaveFilePicker === "function"){
    const handle = await window.showSaveFilePicker({
      id: "tso-resource-package",
      startIn: "downloads",
      suggestedName,
      types: [{
        description: "TSO resource package",
        accept: {
          "application/zip": [".zip"]
        }
      }]
    });
    return { kind:"file-handle", handle, suggestedName };
  }
  return { kind:"download", suggestedName };
}

async function saveResourcePackageBlob(target, blob){
  if(target && target.kind === "file-handle" && target.handle){
    const writable = await target.handle.createWritable();
    try{
      await writable.write(blob);
      await writable.close();
    }catch(err){
      try{
        await writable.abort();
      }catch(_err){}
      throw err;
    }
    return;
  }

  const url = URL.createObjectURL(blob);
  try{
    const a = document.createElement("a");
    a.href = url;
    a.download = target && target.suggestedName ? target.suggestedName : "tso-resource-package.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }finally{
    URL.revokeObjectURL(url);
  }
}

async function exportPackage(){
  // Exports package ZIP: tso-resources.json + any referenced PDF blobs.
  if(!commitPendingEditsIfChanged()) return;

  if(typeof JSZip === "undefined"){
    alert("ZIP support is unavailable. Reload the app and try again.");
    return;
  }

  try{
    const saveTarget = await beginResourcePackageSave();
    const zip = new JSZip();
    normalizePackageData(data);
    zip.file("tso-resources.json", JSON.stringify(data, null, 2));

    const pdfKeys = collectPDFPathsFromResources(data.resources);

    for(const key of pdfKeys){
      const blob = await getPDF(key);
      if(blob){
        zip.file(key, blob);
      }
    }

    const blob = await zip.generateAsync({ type: "blob" });
    await saveResourcePackageBlob(saveTarget, blob);
    showToast("Resource package saved");
  }catch(err){
    if(err && err.name === "AbortError") return;
    alert("Save failed: " + err.message);
  }
}

function beginMergeImportPackage(){
  // Opens a package ZIP picker for merge-based resource reload.
  if(!commitPendingEditsIfChanged()) return;

  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".zip";
  input.style.display = "none";
  input.onchange = mergeImportPackage;
  document.body.appendChild(input);
  input.value = "";
  input.click();
}

function validateImportData(imported){
  // Validates imported tso-resources.json structure before merging current data.
  const errors = [];
  const warnings = [];

  if(!imported || typeof imported !== "object"){
    return { ok:false, errors:["File is not a valid JSON object"], warnings:[] };
  }

  if(!Array.isArray(imported.categories)){
    errors.push("Missing or invalid 'categories' array");
  }

  if(!Array.isArray(imported.resources)){
    errors.push("Missing or invalid 'resources' array");
  }

  const categoryIds = new Set();
  (Array.isArray(imported.categories) ? imported.categories : []).forEach((c, i) => {
    if(!c.id) errors.push(`Category at index ${i} is missing id`);
    if(!c.label) warnings.push(`Category '${c.id || i}' missing label`);
    if(c.id){
      if(categoryIds.has(c.id)){
        errors.push(`Duplicate category id '${c.id}'`);
      }
      categoryIds.add(c.id);
    }
  });

  const resourceIds = new Set();
  (Array.isArray(imported.resources) ? imported.resources : []).forEach((r, i) => {
    if(!r.id) errors.push(`Resource at index ${i} missing id`);
    if(!r.name) warnings.push(`Resource '${r.id || i}' missing name`);

    if(r.id){
      if(resourceIds.has(r.id)){
        errors.push(`Duplicate resource id '${r.id}'`);
      }
      resourceIds.add(r.id);
    }

    if(Array.isArray(r.categories)){
      r.categories.forEach(catId => {
        if(!categoryIds.has(catId)){
          warnings.push(`Resource '${r.id}' references unknown category '${catId}'`);
        }
      });
    }
  });

  return {
    ok: errors.length === 0,
    errors,
    warnings
  };
}

async function mergeImportPackage(event){
  // Imports package ZIP, validates JSON, merges data, then stores referenced PDFs.
  if(!commitPendingEditsIfChanged()){
    event.target.remove();
    return;
  }

  const file = event.target.files && event.target.files[0];
  if(!file){
    event.target.remove();
    return;
  }

  try{
    if(typeof JSZip === "undefined"){
      throw new Error("ZIP support is unavailable. Reload the app and try again.");
    }
    const zip = await JSZip.loadAsync(file);
    const jsonFile = zip.file("tso-resources.json");
    if(!jsonFile){
      alert("Package missing tso-resources.json");
      return;
    }

    const jsonText = await jsonFile.async("string");
    const imported = JSON.parse(jsonText);

    const report = validateImportData(imported);
    if(!report.ok){
      alert(
        "Load failed due to errors:\n\n" +
        report.errors.join("\n")
      );
      return;
    }
    normalizePackageData(imported);
    const importedChangeIds = new Set((imported.changes || []).map(entry => String(entry && entry.id || "")).filter(Boolean));

    const localResourcesWithPdf = ((data && data.resources) || [])
      .map(r => ({ resource:r, paths:collectPDFPathsFromResource(r) }))
      .filter(item => item.paths.length);
    const { mergedData } = mergeResourcePackages(data, imported);
    const mergedById = new Map((mergedData.resources || []).map(r => [String(r && r.id || ""), r]));
    const resourcesWithPdf = localResourcesWithPdf
      .filter(item => {
        const mergedResource = mergedById.get(String(item.resource && item.resource.id || ""));
        const mergedPaths = new Set(collectPDFPathsFromResource(mergedResource));
        return item.paths.some(path => !mergedPaths.has(path));
      })
      .map(item => item.resource.name);

    const missingPdfPaths = await mergeZipAssets(zip, mergedData);
    applyMergedData(mergedData);
    const loadedChanges = getRecentChanges().filter(entry => importedChangeIds.has(String(entry.id || "")));
    if(loadedChanges.length){
      pendingRecentUpdates = loadedChanges;
      recentUpdateDetail = loadedChanges;
      view = "recent-updates";
      markChangesViewed(loadedChanges.map(entry => entry.id));
      safeRender();
    }
    const warningBlocks = [];
    if(resourcesWithPdf.length > 0){
      warningBlocks.push(
        "The following PDFs were not preserved:\n\n" +
        resourcesWithPdf.map(name => `• ${name}`).join("\n")
      );
    }
    if(missingPdfPaths.length > 0){
      warningBlocks.push(
        "The package referenced PDF files that were not found in the zip:\n\n" +
        missingPdfPaths.map(path => `• ${path}`).join("\n")
      );
    }
    if(warningBlocks.length){
      alert(warningBlocks.join("\n\n"));
    }else{
      showToast(
        "Resources loaded successfully.\n" +
        "You may now delete tso-resource-package.zip if desired."
      );
    }
  }catch(e){
    alert("Load failed: " + e.message);
  }finally{
    // allow re-import of same filename
    event.target.value = "";
    event.target.remove();
  }
}

function getReferenceCategoryEntries(resource){
  const categoryIds = Array.isArray(resource && resource.categories)
    ? resource.categories.map(id => String(id || "")).filter(Boolean)
    : [];
  const categoryIdSet = new Set(categoryIds);
  const entries = [];
  const seen = new Set();

  (Array.isArray(data.categories) ? data.categories : [])
    .slice()
    .sort((a,b)=>(a.displayOrder??999)-(b.displayOrder??999))
    .forEach((cat, index) => {
      const id = String(cat && cat.id || "");
      if(!categoryIdSet.has(id)) return;
      const label = String(cat && cat.label || id || "Uncategorized");
      const key = label.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      entries.push({ label, order:index });
    });

  categoryIds.forEach(id => {
    if(entries.some(entry => entry.label === id)) return;
    if((data.categories || []).some(cat => String(cat && cat.id || "") === id)) return;
    const key = id.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    entries.push({ label:id, order:9999 });
  });

  if(!entries.length){
    entries.push({ label:"Uncategorized", order:9999 });
  }

  return entries;
}

function normalizeReferenceSearchText(value){
  return String(value || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim()
    .replace(/\s+/g, " ");
}

function getReferenceTokens(value){
  const normalized = normalizeReferenceSearchText(value);
  return normalized ? normalized.split(" ") : [];
}

function isReferenceNameSearchable(resourceName){
  const rawName = String(resourceName || "").trim();
  if(!rawName) return false;
  if(rawName.length >= 4) return true;
  if(/\s/.test(rawName)) return true;
  return /[A-Z]/.test(rawName) && rawName === rawName.toUpperCase();
}

function servicesTextReferencesName(servicesText, resourceName){
  if(!isReferenceNameSearchable(resourceName)) return false;
  const needleTokens = getReferenceTokens(resourceName);
  const haystackTokens = getReferenceTokens(servicesText);
  if(!needleTokens.length || haystackTokens.length < needleTokens.length) return false;

  for(let i = 0; i <= haystackTokens.length - needleTokens.length; i += 1){
    let matched = true;
    for(let j = 0; j < needleTokens.length; j += 1){
      if(haystackTokens[i + j] !== needleTokens[j]){
        matched = false;
        break;
      }
    }
    if(matched) return true;
  }
  return false;
}

function getReferenceSnippet(servicesText, resourceName){
  const text = String(servicesText || "").replace(/\s+/g, " ").trim();
  if(!text) return "";

  const lowerText = text.toLowerCase();
  const lowerName = String(resourceName || "").toLowerCase();
  const directIndex = lowerName ? lowerText.indexOf(lowerName) : -1;
  const center = directIndex >= 0 ? directIndex : 0;
  const start = Math.max(0, center - 70);
  const end = Math.min(text.length, center + Math.max(lowerName.length, 1) + 90);
  const prefix = start > 0 ? "... " : "";
  const suffix = end < text.length ? " ..." : "";
  return `${prefix}${text.slice(start, end)}${suffix}`;
}

function resourceHasListTag(resource){
  return normalizeResourceTags(resource && resource.tags)
    .some(tag => tag.toLowerCase() === "list");
}

function resourceIsListStyle(resource){
  if(resourceHasListTag(resource)) return true;
  return String(resource && resource.servicesText || "").trim().length > 500;
}

function findReferencingLists(resourceOrName){
  const targetId = resourceOrName && typeof resourceOrName === "object"
    ? String(resourceOrName.id || "")
    : "";
  const resourceName = resourceOrName && typeof resourceOrName === "object"
    ? resourceOrName.name
    : resourceOrName;
  const needle = String(resourceName || "").trim();
  if(!isReferenceNameSearchable(needle)) return [];

  const matches = [];
  const seen = new Set();
  (Array.isArray(data.resources) ? data.resources : []).forEach(resource => {
    const resourceId = String(resource && resource.id || "");
    if(targetId && resourceId === targetId) return;
    if(!resourceIsListStyle(resource)) return;
    const servicesText = String(resource && resource.servicesText || "");
    if(!servicesTextReferencesName(servicesText, needle)) return;

    const listName = String(resource && resource.name || "(Unnamed list)");
    const key = String(resource && resource.id || listName).toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    const categoryEntries = getReferenceCategoryEntries(resource);
    matches.push({
      categoryLabels: categoryEntries.map(category => category.label),
      categoryOrder: Math.min(...categoryEntries.map(category => category.order)),
      listName,
      snippet: getReferenceSnippet(servicesText, needle)
    });
  });

  return matches.sort((a, b) => {
    if(a.categoryOrder !== b.categoryOrder) return a.categoryOrder - b.categoryOrder;
    return a.listName.localeCompare(b.listName, undefined, { sensitivity:"base" });
  });
}

function getReferenceModal(){
  let modal = document.getElementById("referenceModal");
  if(modal) return modal;

  modal = document.createElement("div");
  modal.id = "referenceModal";
  modal.className = "reference-modal hidden";
  modal.addEventListener("click", event => {
    if(event.target === modal) closeReferenceModal();
  });
  document.body.appendChild(modal);
  return modal;
}

function closeReferenceModal(){
  const modal = document.getElementById("referenceModal");
  if(modal) modal.classList.add("hidden");
}

function showReferenceModal(resourceName, matches){
  const modal = getReferenceModal();
  const matchItems = Array.isArray(matches) ? matches : [];
  const bodyHTML = matchItems.length
    ? matchItems.map(match => {
      const categoryLabels = Array.isArray(match && match.categoryLabels) && match.categoryLabels.length
        ? match.categoryLabels
        : ["Uncategorized"];
      return `
        <div class="reference-match">
          <div class="reference-match-name">${escapeHTML(match && match.listName || "(Unnamed list)")}</div>
          <div class="reference-match-categories">Categories: ${escapeHTML(categoryLabels.join(", "))}</div>
          ${match && match.snippet ? `<div class="reference-match-snippet">${escapeHTML(match.snippet)}</div>` : ""}
        </div>
      `;
    }).join("")
    : `<p class="reference-empty">No list resources reference this resource.</p>`;

  modal.innerHTML = `
    <div class="reference-modal-panel" role="dialog" aria-modal="true" aria-labelledby="referenceModalTitle" aria-describedby="referenceModalSubtitle">
      <div class="reference-modal-header">
        <div>
          <div id="referenceModalTitle" class="reference-modal-title">Referenced By Lists</div>
          <div id="referenceModalSubtitle" class="reference-modal-subtitle">${escapeHTML(resourceName)}</div>
        </div>
        <button class="button reference-modal-close" type="button">Close</button>
      </div>
      <div class="reference-modal-body">${bodyHTML}</div>
    </div>
  `;

  const closeBtn = modal.querySelector(".reference-modal-close");
  if(closeBtn) closeBtn.addEventListener("click", closeReferenceModal);
  modal.classList.remove("hidden");
  if(closeBtn) closeBtn.focus();
}

function handleAdminResourceReferenceClick(event, sel){
  if(!event.altKey) return;
  window.setTimeout(() => {
    if(!(view === "admin" && adminTab === "resources" && !adminResourceEditMode)) return;
    const resourceId = sel && sel.value ? String(sel.value) : "";
    const resource = (data.resources || []).find(res => String(res && res.id || "") === resourceId);
    const resourceName = String(resource && resource.name || "").trim();
    if(!resourceName) return;
    selectedResourceId = resourceId;
    showReferenceModal(resourceName, findReferencingLists(resource));
  }, 0);
}

function handleAdminListReferenceInspection(event, resource){
  if(!event.altKey || !isAdminVisible) return false;
  const resourceName = String(resource && resource.name || "").trim();
  if(!resourceName) return false;

  event.preventDefault();
  event.stopPropagation();
  event.stopImmediatePropagation();
  showReferenceModal(resourceName, findReferencingLists(resource));
  return true;
}

function switchAdminTab(nextTab){
  if(adminTab === nextTab) return;
  if(!commitPendingEditsIfChanged()) return;
  if(nextTab !== "resources"){
    adminResourceEditMode = false;
  }
  adminTab = nextTab;
  safeRenderAdmin();
}

function categoryEditorDraft(){
  // Capture category editor form state as a plain draft object.
  const labelEl = document.getElementById("cat_label");
  const orderEl = document.getElementById("cat_order");
  const updateEl = document.getElementById("cat_update_description");
  if(!labelEl || !orderEl || !editing || editing.kind !== "category") return null;
  const cat = data.categories[editing.idx];
  if(!cat) return null;
  return {
    id: cat.id || generateResourceId(),
    label: labelEl.value.trim(),
    displayOrder: orderEl.value,
    updateDescription: updateEl ? updateEl.value.trim() : ""
  };
}

function resourceEditorDraft(){
  // Capture resource editor form state as a plain draft object.
  const nameEl = document.getElementById("res_name");
  const phoneEl = document.getElementById("res_phone");
  const addressEl = document.getElementById("res_address");
  const websiteEl = document.getElementById("res_website");
  const hoursEl = document.getElementById("res_hours");
  const descEl = document.getElementById("res_description");
  const servicesEl = document.getElementById("res_services");
  const tagsEl = document.getElementById("res_tags");
  const updateEl = document.getElementById("res_update_description");
  if(!nameEl || !phoneEl || !addressEl || !websiteEl || !hoursEl || !descEl || !servicesEl || !tagsEl) return null;
  const verifiedEl = document.getElementById("res_verified_on");
  const verifiedOn = verifiedEl ? verifiedEl.value.trim() : "";
  const pdfs = editing?.kind === "resource"
    ? getResourcePDFs(data.resources[editing.idx]).map(pdf => ({ ...pdf }))
    : [];
  const tags = parseResourceTagsInput(tagsEl.value);

  return {
    name: nameEl.value.trim(),
    phone: phoneEl.value.trim(),
    address: addressEl.value.trim(),
    website: websiteEl.value.trim(),
    hours: hoursEl.value.trim(),
    description: descEl.value,
    servicesText: servicesEl.value,
    pdfs,
    verifiedOn,
    categories: Array.from(document.querySelectorAll(".resCat"))
      .filter(cb=>cb.checked)
      .map(cb=>cb.value)
      .sort(),
    tags,
    updateDescription: updateEl ? updateEl.value.trim() : ""
  };
}

function getResourceIndexById(resourceId){
  if(!resourceId) return -1;
  return data.resources.findIndex(r => r && r.id === resourceId);
}

function validateResourceName(draft, idx){
  // Prevent empty names and duplicates before applying/persisting resource edits.
  const name = String(draft && draft.name || "").trim();
  if(!name){
    return { valid:false, message:"Name is required." };
  }
  const lower = name.toLowerCase();
  const duplicate = data.resources.some((r, i) => i !== idx && String(r && r.name || "").trim().toLowerCase() === lower);
  if(duplicate){
    return { valid:false, message:"Another resource already uses this name." };
  }
  return { valid:true, message:"" };
}

function normalizeCategoryName(name){
  return String(name || "").trim().toLowerCase();
}

function categoryNameExists(name, excludeId){
  const normalizedName = normalizeCategoryName(name);
  if(!normalizedName) return false;
  return (Array.isArray(data.categories) ? data.categories : []).some(cat => {
    if(excludeId && String(cat && cat.id || "") === String(excludeId)) return false;
    return normalizeCategoryName(cat && cat.label) === normalizedName;
  });
}

function validateCategoryDraft(draft){
  // Delegate numeric display-order checks to browser input validity.
  const orderInput = document.getElementById("cat_order");
  if(orderInput && !orderInput.checkValidity()){
    return { valid:false, message:orderInput.validationMessage || "Display order must be a number." };
  }
  if(categoryNameExists(draft && draft.label, draft && draft.id)){
    return { valid:false, message:"Category already exists." };
  }
  return { valid:true, message:"" };
}

function showCategoryEditorWarning(message){
  const warning = document.getElementById("cat_editor_warning");
  if(!warning) return;
  warning.textContent = message || "";
  warning.style.display = message ? "block" : "none";
}

function showResourceNameWarning(message){
  const warning = document.getElementById("res_name_warning");
  if(!warning) return;
  warning.textContent = message || "";
  warning.style.display = message ? "block" : "none";
}

function showResourceVerifiedWarning(message){
  const warning = document.getElementById("res_verified_warning");
  if(!warning) return;
  warning.textContent = message || "";
}

function snapshotCategoryEditor(){
  // Snapshot string supports cheap "changed?" detection for category drafts.
  const draft = categoryEditorDraft();
  return draft ? JSON.stringify(draft) : "";
}

function snapshotResourceEditor(){
  // Snapshot string supports cheap "changed?" detection for resource drafts.
  const draft = resourceEditorDraft();
  return draft ? JSON.stringify(draft) : "";
}

function applyCategoryDraft(idx, draft){
  // Apply validated category draft into canonical data model.
  const cat = data.categories[idx];
  if(!cat) return;
  cat.id = cat.id || draft.id || generateResourceId();
  cat.label = draft.label || cat.label;
  cat.displayOrder = draft.displayOrder === "" ? null : Number(draft.displayOrder);
  cat.lastModified = nowISO();
}

function renderAdminCategoryResourceList(selectedCategoryId){
  const container = document.getElementById("adminCategoryResourceList");
  if(!container) return;

  const hasSelectedCategory = !!selectedCategoryId && data.categories.some(cat => cat && cat.id === selectedCategoryId);
  if(!hasSelectedCategory){
    container.innerHTML = "";
    container.style.display = "none";
    return;
  }

  const resources = data.resources
    .filter(r => r.categories?.includes(selectedCategoryId))
    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));

  container.style.display = "block";
  container.innerHTML = `
    <div style="margin-top:12px;">
      <div style="font-weight:bold; margin-bottom:8px;">Resources in this category</div>
      <div id="adminCategoryResourceItems"></div>
    </div>
  `;

  const list = document.getElementById("adminCategoryResourceItems");
  if(!list) return;

  if(!resources.length){
    list.textContent = "No resources assigned to this category.";
    return;
  }

  resources.forEach(resource => {
    const row = document.createElement("div");
    const resourceId = String(resource.id || "");
    row.setAttribute("role", "button");
    row.tabIndex = 0;
    row.textContent = resource.name || "";
    row.addEventListener("click", () => openAdminCategoryResourceById(resourceId));
    row.addEventListener("keydown", event => {
      if(event.key === "Enter" || event.key === " "){
        event.preventDefault();
        openAdminCategoryResourceById(resourceId);
      }
    });
    list.appendChild(row);
  });
}

function refreshAdminCategoryResourceList(){
  const idx = parseInt(selectedCategoryIndex, 10);
  const cat = Number.isInteger(idx) ? data.categories[idx] : null;
  renderAdminCategoryResourceList(cat && cat.id ? cat.id : "");
}

function openAdminCategoryResourceById(resourceId){
  if(!commitPendingEditsIfChanged()) return;
  const nextResourceId = String(resourceId || "");
  if(!nextResourceId) return;
  const idx = getResourceIndexById(nextResourceId);
  if(idx === -1) return;
  selectedResourceId = nextResourceId;
  adminTab = "resources";
  openResourceEditor();
}

function openCategoryOrderEditor(){
  if(!commitPendingEditsIfChanged()) return;
  const rows = data.categories.map((cat, idx) => {
    const rawOrder = cat.displayOrder;
    const numericOrder = rawOrder == null || rawOrder === "" ? null : Number(rawOrder);
    return {
      idx,
      label: cat.label || "",
      order: Number.isFinite(numericOrder) ? numericOrder : null,
      value: rawOrder == null ? "" : String(rawOrder)
    };
  });
  rows.sort((a, b) => {
    const aMissing = a.order == null;
    const bMissing = b.order == null;
    if(aMissing !== bMissing) return aMissing ? 1 : -1;
    if(!aMissing && a.order !== b.order) return a.order - b.order;
    const labelCmp = a.label.localeCompare(b.label);
    if(labelCmp !== 0) return labelCmp;
    return a.idx - b.idx;
  });
  adminCategoryOrderEditorOpen = true;
  adminCategoryOrderDraft = rows.map(row => ({ idx: row.idx, value: row.value }));
  safeRenderAdmin();
}

function closeCategoryOrderEditor(shouldRender = true){
  adminCategoryOrderEditorOpen = false;
  adminCategoryOrderDraft = null;
  if(shouldRender) safeRenderAdmin();
}

function applyCategoryOrderEditor(){
  const draft = Array.isArray(adminCategoryOrderDraft)
    ? adminCategoryOrderDraft.map((row, pos) => ({
      idx: Number(row && row.idx),
      value: row && typeof row.value === "string" ? row.value : "",
      pos
    }))
    : [];
  // Close first to avoid visible panel flicker during render/update.
  adminCategoryOrderEditorOpen = false;
  adminCategoryOrderDraft = null;

  const sortedRows = draft
    .filter(row => Number.isInteger(row.idx) && row.idx >= 0 && row.idx < data.categories.length)
    .map(row => {
      const raw = row.value.trim();
      const numeric = raw === "" ? null : Number(raw);
      return {
        idx: row.idx,
        pos: row.pos,
        label: (data.categories[row.idx] && data.categories[row.idx].label) || "",
        order: raw === "" || !Number.isFinite(numeric) ? null : numeric
      };
    });

  sortedRows.sort((a, b) => {
    const aMissing = a.order == null;
    const bMissing = b.order == null;
    if(aMissing !== bMissing) return aMissing ? 1 : -1;
    if(!aMissing && a.order !== b.order) return a.order - b.order;
    const labelCmp = a.label.localeCompare(b.label);
    if(labelCmp !== 0) return labelCmp;
    return a.pos - b.pos;
  });

  let changed = false;
  sortedRows.forEach((row, orderIdx) => {
    const cat = data.categories[row.idx];
    if(!cat) return;
    const nextDisplayOrder = (orderIdx + 1) * 10;
    const prevRaw = cat.displayOrder;
    const prevDisplayOrder = prevRaw == null || prevRaw === "" ? null : Number(prevRaw);
    if(prevDisplayOrder !== nextDisplayOrder){
      cat.displayOrder = nextDisplayOrder;
      cat.lastModified = nowISO();
      changed = true;
    }
  });

  if(changed) persist();
  safeRenderAdmin();
}

function applyResourceDraft(idx, draft){
  // Apply validated resource draft into canonical data model.
  const res = data.resources[idx];
  if(!res) return;
  res.pdfs = Array.isArray(draft.pdfs) ? draft.pdfs.map(pdf => ({ ...pdf })) : [];
  normalizeResourcePDFs(res);
  if(typeof res.pdf === "string" && !res.pdfs.some(pdf => pdf.path === res.pdf.trim())){
    delete res.pdf;
  }
  res.name = draft.name || res.name;
  res.phone = draft.phone;
  res.address = draft.address;
  res.website = draft.website;
  res.hours = draft.hours;
  res.description = draft.description;
  res.servicesText = draft.servicesText;
  const verifiedValidation = validateVerifiedOnInput(draft.verifiedOn);
  res.verifiedOn = verifiedValidation.valid ? verifiedValidation.normalized : null;
  if("reviewedOn" in res) delete res.reviewedOn;
  if("verifiedDate" in res) delete res.verifiedDate;
  res.categories = draft.categories;
  res.tags = normalizeResourceTags(draft.tags);
  res.lastModified = nowISO();
  refreshAdminCategoryResourceList();
}

function commitPendingEditsIfChanged(){
  // Editor commit pattern:
  // UI fields -> draft snapshot -> validation -> apply canonical update -> persist.
  if(!editing) return true;

  let nextSnapshot = "";
  if(editing.kind === "category"){
    nextSnapshot = snapshotCategoryEditor();
    if(!nextSnapshot) return true;
    const draft = JSON.parse(nextSnapshot);
    const validation = validateCategoryDraft(draft);
    showCategoryEditorWarning(validation.message);
    if(!validation.valid){
      const orderInput = document.getElementById("cat_order");
      if(orderInput) orderInput.focus();
      return false;
    }
    if(nextSnapshot !== editorSnapshot){
      const action = newCategoryIds.has(draft.id) ? "added" : "updated";
      applyCategoryDraft(editing.idx, draft);
      addChangeEntry(createChangeEntry("category", action, draft.id, draft.label || "(Unnamed category)", draft.updateDescription));
      newCategoryIds.delete(draft.id);
      persist();
      editorSnapshot = nextSnapshot;
    }
    return true;
  }

  if(editing.kind === "resource"){
    nextSnapshot = snapshotResourceEditor();
    if(!nextSnapshot) return true;
    const draft = JSON.parse(nextSnapshot);
    const validation = validateResourceName(draft, editing.idx);
    const verifiedValidation = validateVerifiedOnInput(draft.verifiedOn);
    showResourceNameWarning(validation.message);
    showResourceVerifiedWarning(verifiedValidation.message);
    if(!validation.valid){
      const nameInput = document.getElementById("res_name");
      if(nameInput) nameInput.focus();
      return false;
    }
    if(!verifiedValidation.valid){
      const verifiedInput = document.getElementById("res_verified_on");
      if(verifiedInput) verifiedInput.focus();
      return false;
    }
    if(nextSnapshot !== editorSnapshot && !confirmCategoryAssignmentHint(draft)){
      return false;
    }
    if(nextSnapshot !== editorSnapshot){
      const resource = data.resources[editing.idx];
      const resourceId = resource && resource.id ? resource.id : "";
      const action = newResourceIds.has(resourceId) ? "added" : "updated";
      applyResourceDraft(editing.idx, draft);
      const saved = data.resources[editing.idx];
      addChangeEntry(createChangeEntry("resource", action, saved && saved.id, draft.name || "(Unnamed resource)", draft.updateDescription, { categoryIds:draft.categories }));
      if(saved && saved.id) newResourceIds.delete(saved.id);
      persist();
      editorSnapshot = nextSnapshot;
      if(saved && saved.id) selectedResourceId = saved.id;
    }
    return true;
  }
  return true;
}

function renderAdminCategories(container){
  // Category management view (list, editor, order controls, and related actions).

  container.innerHTML += `
    <div class="admin-panel">
      <div class="admin-box">
        <h3 class="admin-panel-title">Categories</h3>
        <div class="admin-action-row" style="margin-bottom:8px;">
          <button class="button" onclick="newCategory()">New</button>
          <button class="button danger" onclick="deleteCategory()">Delete</button>
          <button class="button" onclick="openCategoryOrderEditor()">Edit display order...</button>
        </div>
        <select id="catSelect"></select>
        <div id="adminCategoryResourceList" style="display:none;"></div>
        <div id="categoryOrderOverlay" style="${adminCategoryOrderEditorOpen ? "position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; display:flex; align-items:center; justify-content:center;" : "display:none;"}">
          <div id="categoryOrderPanel" style="background:#fff; border-radius:8px; border:1px solid #ccc; width:min(640px,90vw); max-height:80vh; overflow:auto; padding:12px;">
            <h4 style="margin:0 0 10px 0;">Edit display order</h4>
            <div id="categoryOrderRows"></div>
            <div style="margin-top:12px; display:flex; gap:8px;">
              <button class="button primary" type="button" id="categoryOrderOkBtn">OK</button>
              <button class="button" type="button" id="categoryOrderCancelBtn">Cancel</button>
            </div>
          </div>
        </div>
      </div>
      <div class="admin-box" id="catEditor"></div>
    </div>
  `;

  const sel = document.getElementById("catSelect");

  // sort for display, but keep option value = real index
  const pairs = data.categories.map((c,i)=>({c,i}));
  pairs.sort((a,b)=>(a.c.displayOrder ?? 999)-(b.c.displayOrder ?? 999));

  pairs.forEach(({c,i})=>{
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = c.label;
    sel.appendChild(opt);
  });

  sel.onchange = () => {
    if(!commitPendingEditsIfChanged()) return;
    selectedCategoryIndex = sel.value;
    editCategory(parseInt(sel.value,10));
  };

  if(sel.options.length && Array.from(sel.options).some(opt => opt.value === selectedCategoryIndex)){
    sel.value = selectedCategoryIndex;
    editCategory(parseInt(sel.value,10));
  }else if(sel.options.length){
    sel.value = sel.options[0].value;
    selectedCategoryIndex = sel.value;
    editCategory(parseInt(sel.value,10));
  }else{
    editing = null;
    editorSnapshot = "";
    selectedCategoryIndex = "";
    renderAdminCategoryResourceList("");
  }

  if(adminCategoryOrderEditorOpen){
    const panel = document.getElementById("categoryOrderPanel");
    const overlay = document.getElementById("categoryOrderOverlay");
    const rows = document.getElementById("categoryOrderRows");
    const okBtn = document.getElementById("categoryOrderOkBtn");
    const cancelBtn = document.getElementById("categoryOrderCancelBtn");
    const draft = Array.isArray(adminCategoryOrderDraft) ? adminCategoryOrderDraft : [];
    adminCategoryOrderDraft = draft;

    if(rows){
      rows.innerHTML = "";
      draft.forEach((rowDraft) => {
        const cat = data.categories[rowDraft.idx];
        if(!cat) return;
        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.alignItems = "center";
        row.style.gap = "10px";
        row.style.marginBottom = "8px";

        const label = document.createElement("div");
        label.style.flex = "1";
        label.textContent = cat.label || "(no label)";

        const input = document.createElement("input");
        input.type = "number";
        input.className = "category-order-input";
        input.value = rowDraft.value ?? "";
        input.style.width = "130px";
        input.oninput = () => { rowDraft.value = input.value; };

        row.appendChild(label);
        row.appendChild(input);
        rows.appendChild(row);
      });
    }

    if(okBtn){
      okBtn.onclick = (e) => {
        e.stopPropagation();
        applyCategoryOrderEditor();
      };
    }
    if(cancelBtn){
      cancelBtn.onclick = (e) => {
        e.stopPropagation();
        closeCategoryOrderEditor(true);
      };
    }
    if(panel) panel.addEventListener("click", (e) => e.stopPropagation());
    if(overlay){
      overlay.addEventListener("click", () => {
        closeCategoryOrderEditor(true);
      });
    }
  }
}

function newCategory(){
  if(!commitPendingEditsIfChanged()) return;
  const newIndex = data.categories.length;
  const categoryId = generateResourceId();

  data.categories.push({
    id: categoryId,
    label: "",
    active: true,
    lastModified: nowISO(),
    displayOrder: null
  });

  persist();
  newCategoryIds.add(categoryId);
  adminTab = "categories";
  selectedCategoryIndex = String(newIndex);
  safeRenderAdmin();
  const labelInput = document.getElementById("cat_label");
  if(labelInput) labelInput.focus();
}

function cancelCategoryEdit(){
  if(!editing || editing.kind !== "category") return;
  const cat = data.categories[editing.idx];
  if(cat && newCategoryIds.has(cat.id)){
    data.categories.splice(editing.idx, 1);
    newCategoryIds.delete(cat.id);
    delete categoryTagFilters[cat.id];
    selectedCategoryIndex = "";
    editing = null;
    persist();
    safeRenderAdmin();
    return;
  }
  editCategory(editing.idx);
}

function deleteCategory(){
  if(!commitPendingEditsIfChanged()) return;
  const sel = document.getElementById("catSelect");
  if(!sel || !sel.value) return;

  const idx = parseInt(sel.value,10);
  const cat = data.categories[idx];
  if(!cat) return;

  const confirmDelete = confirm(buildAdminDeleteConfirmation("category", cat.label || "(unnamed)"));
  if(!confirmDelete) return;
  const updateDescription = prompt("Describe this update (optional):", "") || "";
  setUndoSnapshot(`deleted category "${cat.label}"`);

  // remove category from resources too
  data.resources.forEach(r=>{
    if(Array.isArray(r.categories)){
      r.categories = r.categories.filter(id => id !== cat.id);
    }
  });

  data.categories.splice(idx,1);
  delete categoryTagFilters[cat.id];
  addChangeEntry(createChangeEntry("category", "removed", cat.id, cat.label || "(Unnamed category)", updateDescription));
  newCategoryIds.delete(cat.id);
  selectedCategoryIndex = "";
  persist();
  safeRenderAdmin();
}

function closeCategoryEditor(){
  if(!commitPendingEditsIfChanged()) return;
  safeRenderAdmin();
  const sel = document.getElementById("catSelect");
  if(sel) sel.focus();
}

function editCategory(idx){
  const cat = data.categories[idx];
  renderAdminCategoryResourceList(cat && cat.id ? cat.id : "");
  const editor = document.getElementById("catEditor");
  if(!cat || !editor) return;
  selectedCategoryIndex = String(idx);

  editor.innerHTML = `
    <h3>Edit Category</h3>

    <label>Label<br>
      <input id="cat_label" value="${escapeHTML(cat.label || "")}">
    </label>
    <div id="cat_editor_warning" style="display:none; color:#aa0000; margin-top:4px;"></div><br>

    <label>Display order (optional)<br>
      <input id="cat_order" type="number" value="${cat.displayOrder ?? ""}">
    </label><br><br>
    <label>Describe this update (optional)<br>
      <textarea id="cat_update_description" class="big" style="min-height:60px;"></textarea>
    </label><br><br>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="button" type="button" onclick="cancelCategoryEdit()">Cancel</button>
      <button class="button primary" type="button" id="cat_done_btn" onclick="closeCategoryEditor()">Done</button>
    </div>
  `;

  editing = { kind: "category", idx };
  editorSnapshot = snapshotCategoryEditor();

  const labelInput = document.getElementById("cat_label");
  const orderInput = document.getElementById("cat_order");
  const updateInput = document.getElementById("cat_update_description");
  const doneBtn = document.getElementById("cat_done_btn");
  function validateCategoryEditorState(){
    const draft = categoryEditorDraft();
    if(!draft){
      showCategoryEditorWarning("");
      if(doneBtn) doneBtn.disabled = false;
      return;
    }
    const validation = validateCategoryDraft(draft);
    showCategoryEditorWarning(validation.message);
    if(doneBtn) doneBtn.disabled = !validation.valid;
  }
  if(labelInput) labelInput.addEventListener("input", validateCategoryEditorState);
  if(orderInput) orderInput.addEventListener("input", validateCategoryEditorState);
  if(updateInput) updateInput.addEventListener("input", validateCategoryEditorState);
  validateCategoryEditorState();
}

/* ---------- Admin: Resources ---------- */

function renderAdminResources(container){
  // Resource management view (browse list, edit mode, tags, PDF association).
  if(adminResourceEditMode && !selectedResourceId && data.resources[0] && data.resources[0].id){
    selectedResourceId = data.resources[0].id;
  }

  if(!adminResourceEditMode){
    container.innerHTML += `
      <div class="admin-panel">
        <div class="admin-box">
          <h3 class="admin-panel-title">Resources</h3>
      <div class="resource-browse-wrap">
        <label class="admin-option-row" style="display:block;">
          <input type="checkbox" id="resSortShowVerified">
          Show verified dates
        </label>
            <div class="resource-browse-actions admin-action-row" style="margin-top:12px;">
              <button class="button" onclick="newResource()">New</button>
              <button class="button danger" onclick="deleteResource()">Delete</button>
              <span class="spacer"></span>
              <button class="button primary" onclick="openResourceEditor()">Edit</button>
            </div>
        <select id="resSelect" class="resource-listbox" size="25" style="margin-top:8px;"></select>
          </div>
        </div>
      </div>
    `;

    const sel = document.getElementById("resSelect");
    const sortToggle = document.getElementById("resSortShowVerified");
    if(sortToggle){
      sortToggle.checked = adminShowVerifiedDates;
      sortToggle.onchange = () => {
        adminShowVerifiedDates = !!sortToggle.checked;
        populateResourceSelectOptions(sel, selectedResourceId);
      };
    }

    populateResourceSelectOptions(sel, selectedResourceId);
    sel.onchange = () => { selectedResourceId = sel.value || ""; };
    sel.addEventListener("click", event => handleAdminResourceReferenceClick(event, sel));
    sel.ondblclick = () => {
      if(document.activeElement !== sel) return;
      openResourceEditor();
    };
    sel.onkeydown = (e) => {
      if(document.activeElement !== sel) return;
      if(e.key === "Enter"){
        e.preventDefault();
        openResourceEditor();
        return;
      }
      if(e.key === "Delete"){
        e.preventDefault();
        deleteResource();
      }
    };

    editing = null;
    editorSnapshot = "";
    return;
  }

  const idx = getResourceIndexById(selectedResourceId);
  if(idx === -1){
    adminResourceEditMode = false;
    safeRenderAdmin();
    return;
  }

  container.innerHTML += `
    <div class="admin-panel">
      <div class="admin-box">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <h3 style="margin:0;">Edit Resource</h3>
          <div style="display:flex; gap:8px; align-items:center;">
            <button class="button" type="button" onclick="cancelResourceEditor()">Cancel</button>
            <button id="res_done_btn" class="button primary" onclick="closeResourceEditor()">Done</button>
          </div>
        </div>
        <div id="resEditor" style="margin-top:12px;"></div>
      </div>
    </div>
  `;

  editResource(idx);
}

function populateResourceSelectOptions(sel, preferredResourceId){
  if(!sel) return;
  const prev = preferredResourceId || selectedResourceId || sel.value || "";
  sel.innerHTML = "";

  getAdminResourceBrowseList().forEach((r) => {
      const opt = document.createElement("option");
      opt.value = String(r.id || "");
      const verifiedLabel = isValidMMYY(r.verifiedOn)
        ? `${r.name || ""} \u2014 ${formatVerifiedOnForDisplay(r.verifiedOn)}`
        : (r.name || "");
      opt.textContent = adminShowVerifiedDates ? verifiedLabel : (r.name || "");
      sel.appendChild(opt);
    });

  if(prev && Array.from(sel.options).some(opt => opt.value === prev)){
    sel.value = prev;
    selectedResourceId = prev;
    return;
  }

  if(sel.options.length){
    sel.value = sel.options[0].value;
    selectedResourceId = sel.value;
  }else{
    selectedResourceId = "";
  }
}

function newResource(){
  if(!commitPendingEditsIfChanged()) return;
  const resourceId = generateResourceId();

  const resource = {
    id: resourceId,
    name: "",
    description: "",
    pdfs: [],
    servicesText: "",
    tags: [],
    verifiedOn: null
  };
  data.resources.push(resource);

  persist();
  newResourceIds.add(resourceId);
  adminTab = "resources";
  selectedResourceId = resource.id;
  adminResourceEditMode = true;
  safeRenderAdmin();
  focusAndSelectResourceName();
}

function discardNewResourceDraft(resourceId){
  const draftId = String(resourceId || "");
  if(!draftId || !newResourceIds.has(draftId)) return false;

  const sortedIds = getAdminResourceBrowseList().map(r => String(r.id || ""));
  const selectedPos = sortedIds.indexOf(draftId);
  const idx = getResourceIndexById(draftId);
  if(idx === -1){
    newResourceIds.delete(draftId);
    return false;
  }

  data.resources.splice(idx, 1);
  newResourceIds.delete(draftId);

  const remainingIds = getAdminResourceBrowseList().map(r => String(r.id || ""));
  if(!remainingIds.length){
    selectedResourceId = "";
    adminResourceEditMode = false;
  }else{
    const nextPos = Math.min(Math.max(selectedPos, 0), remainingIds.length - 1);
    selectedResourceId = remainingIds[nextPos];
  }
  return true;
}

function isBlankResourceDraft(resource){
  if(!resource) return false;
  const hasText = ["name", "description", "phone", "address", "website", "hours", "servicesText"]
    .some(key => String(resource[key] || "").trim());
  const hasLists = ["categories", "tags", "pdfs"]
    .some(key => Array.isArray(resource[key]) && resource[key].length);
  return !hasText && !hasLists;
}

function deleteResource(){
  if(!commitPendingEditsIfChanged()) return;
  if(!selectedResourceId) return;

  const sortedIds = getAdminResourceBrowseList().map(r => String(r.id || ""));
  const selectedPos = sortedIds.indexOf(selectedResourceId);
  const idx = getResourceIndexById(selectedResourceId);
  const res = data.resources[idx];
  if(!res) return;

  const confirmDelete = confirm(buildAdminDeleteConfirmation("resource", res.name || "(unnamed)"));
  if(!confirmDelete) return;
  const updateDescription = prompt("Describe this update (optional):", "");
  if(updateDescription === null) return;
  setUndoSnapshot(`deleted resource "${res.name}"`);

  data.resources.splice(idx,1);
  addChangeEntry(createChangeEntry("resource", "removed", res.id, res.name || "(Unnamed resource)", updateDescription, { categoryIds:res.categories }));
  newResourceIds.delete(res.id);

  const remainingIds = getAdminResourceBrowseList().map(r => String(r.id || ""));
  if(!remainingIds.length){
    selectedResourceId = "";
    adminResourceEditMode = false;
  }else{
    const nextPos = Math.min(Math.max(selectedPos, 0), remainingIds.length - 1);
    selectedResourceId = remainingIds[nextPos];
  }

  persist();
  safeRenderAdmin();
}

function openResourceEditor(){
  if(!selectedResourceId) return;
  adminResourceEditMode = true;
  safeRenderAdmin();
  focusAndSelectResourceName();
}

function focusAndSelectResourceName(){
  const nameInput = document.getElementById("res_name");
  if(!nameInput) return;
  nameInput.focus();
  nameInput.select();
}

function closeResourceEditor(){
  if(!commitPendingEditsIfChanged()) return;
  adminResourceEditMode = false;
  safeRenderAdmin();
}

function cancelResourceEditor(){
  if(discardNewResourceDraft(selectedResourceId)){
    adminResourceEditMode = false;
    persist();
    safeRenderAdmin();
    return;
  }
  adminResourceEditMode = false;
  safeRenderAdmin();
}

function editResource(idx){
  const res = data.resources[idx];
  const editor = document.getElementById("resEditor");
  if(!res || !editor) return;
  selectedResourceId = res.id || selectedResourceId;
  editing = { kind: "resource", idx };

  normalizeResourceServices(res);
  normalizeResourceVerifiedOn(res);
  normalizeResourcePDFs(res);
  res.tags = normalizeResourceTags(res.tags);
  const verifiedDisplay = formatVerifiedOnForDisplay(res.verifiedOn);
  const tagInputValue = res.tags.join("\n");
  const tagSuggestions = getAllTags(res.id);

  const catChecks = data.categories
    .slice()
    .sort((a,b)=>(a.displayOrder ?? 999)-(b.displayOrder ?? 999))
    .map(c=>{
      const checked = (res.categories||[]).includes(c.id) ? "checked" : "";
      return `<label style="display:block;">
        <input type="checkbox" class="resCat" value="${escapeHTML(c.id)}" ${checked}>
        ${escapeHTML(c.label)}
      </label>`;
    }).join("");

  editor.innerHTML = `
    <label>Name<br>
      <input id="res_name" value="${escapeHTML(res.name || "")}">
    </label>
    <div id="res_name_warning" style="display:none; color:#aa0000; margin-top:4px;"></div>

    <div class="resource-editor-grid" style="margin-top:10px;">
      <label>Phone<br>
        <input id="res_phone" value="${escapeHTML(res.phone || "")}">
      </label>
      <label class="span-2">Address<br>
        <input id="res_address" value="${escapeHTML(res.address || "")}">
      </label>

      <label>Website<br>
        <input id="res_website" type="url" value="${escapeHTML(res.website || "")}">
      </label>
      <label>Hours<br>
        <input id="res_hours" value="${escapeHTML(res.hours || "")}">
      </label>
      <div>
        <strong>Verified</strong>
        <div class="verified-row" style="margin-top:4px;">
          <span id="res_verified_display" class="verified-value">${escapeHTML(verifiedDisplay)}</span>
          <button class="button" type="button" id="res_verified_btn">Update</button>
          <input id="res_verified_on" type="text" placeholder="MM/YY" value="${escapeHTML(res.verifiedOn || "")}" style="width:120px;">
        </div>
        <div id="res_verified_warning" class="verified-warning"></div>
      </div>
    </div>

    <label style="display:block; margin-top:8px;">Description<br>
      <textarea id="res_description" class="big">${escapeHTML(res.description || "")}</textarea>
    </label><br>

    <label style="display:block; margin-top:8px;">Describe this update (optional)<br>
      <textarea id="res_update_description" class="big" style="min-height:60px;"></textarea>
    </label><br>

    <label style="display:block; margin-top:8px;">Tags (comma-separated or one per line)<br>
      <textarea id="res_tags" class="big" style="min-height:72px;">${escapeHTML(tagInputValue)}</textarea>
    </label>
    ${tagSuggestions.length ? `
      <div id="res_tag_suggestions" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;">
        ${tagSuggestions.map(tag => `<button class="button" type="button" data-tag-suggestion="${escapeHTML(tag)}">${escapeHTML(tag)}</button>`).join("")}
      </div>
    ` : ""}
    <br>

    <div>
      <strong>Categories</strong><br>
      ${catChecks}
    </div>

    <label style="display:block; font-weight:bold; margin-top:12px;">Services</label>
    <div class="services-control-block">
      <div class="services-control-header">
        <div class="services-preview-toggle">
          <button class="button primary" type="button" id="res_services_edit_btn">Edit</button>
          <button class="button" type="button" id="res_services_preview_btn">Preview</button>
        </div>
        <div class="services-hint">Bullets: start line with "* " | Bold: **text** | Divider: ---</div>
      </div>
      <textarea id="res_services" class="big services-editor">${escapeHTML(res.servicesText || "")}</textarea>
      <div id="res_services_preview" class="services-preview-box services-rendered hidden"></div>
    </div><br>
  `;

  const verifiedBtn = document.getElementById("res_verified_btn");
  const verifiedInput = document.getElementById("res_verified_on");
  const verifiedDisplayEl = document.getElementById("res_verified_display");
  const verifiedWarning = document.getElementById("res_verified_warning");
  const nameEl = document.getElementById("res_name");
  const updateEl = document.getElementById("res_update_description");
  const tagsEl = document.getElementById("res_tags");
  const servicesEl = document.getElementById("res_services");
  const servicesEditBtn = document.getElementById("res_services_edit_btn");
  const servicesPreviewBtn = document.getElementById("res_services_preview_btn");
  const servicesPreviewBox = document.getElementById("res_services_preview");
  const doneBtn = document.getElementById("res_done_btn");
  const servicesBlock = servicesEl ? servicesEl.parentElement : null;
  const pdfs = getResourcePDFs(res);
  const pdfSection = document.createElement("div");
  pdfSection.style.marginBottom = "12px";
  pdfSection.innerHTML = `
    <div><strong>PDF attachments</strong></div>
    <div class="pdf-attachments-list">
      ${pdfs.length ? pdfs.map(pdf => `
        <div class="pdf-attachment-row">
          <span>${escapeHTML(pdf.name || "PDF")}</span>
          <button class="button" type="button" data-remove-pdf-id="${escapeHTML(pdf.id)}">Remove PDF</button>
        </div>
      `).join("") : `<div>No PDFs attached.</div>`}
    </div>
    <input type="file" id="pdfPicker" accept="application/pdf" multiple style="display:none">
    <button class="button" type="button" id="attachPdfBtn">Attach PDF</button>
  `;
  if(servicesBlock){
    editor.insertBefore(pdfSection, servicesBlock);
  }else{
    editor.appendChild(pdfSection);
  }

  function refreshServicesPreview(){
    if(!servicesEl || !servicesPreviewBox) return;
    servicesPreviewBox.innerHTML = renderServicesHTML(servicesEl.value);
  }

  function setServicesEditorMode(mode){
    if(!servicesEl || !servicesPreviewBox || !servicesEditBtn || !servicesPreviewBtn) return;
    const previewMode = mode === "preview";
    servicesEl.classList.toggle("hidden", previewMode);
    servicesPreviewBox.classList.toggle("hidden", !previewMode);
    servicesEditBtn.classList.toggle("primary", !previewMode);
    servicesPreviewBtn.classList.toggle("primary", previewMode);
    if(previewMode) refreshServicesPreview();
  }

  if(servicesEditBtn && servicesPreviewBtn){
    servicesEditBtn.onclick = () => setServicesEditorMode("edit");
    servicesPreviewBtn.onclick = () => setServicesEditorMode("preview");
  }
  if(servicesEl){
    servicesEl.addEventListener("input", refreshServicesPreview);
  }
  setServicesEditorMode("preview");

  function insertTagSuggestion(tag){
    if(!tagsEl) return;
    const nextTags = normalizeResourceTags([...parseResourceTagsInput(tagsEl.value), tag]);
    tagsEl.value = nextTags.join("\n");
    tagsEl.dispatchEvent(new Event("input", { bubbles:true }));
    tagsEl.focus();
  }

  editor.querySelectorAll("[data-tag-suggestion]").forEach(btn => {
    btn.onclick = () => insertTagSuggestion(btn.getAttribute("data-tag-suggestion") || "");
  });

  function updateVerifiedDisplayAndWarning(){
    if(!verifiedInput || !verifiedDisplayEl) return true;
    const validation = validateVerifiedOnInput(verifiedInput.value);
    if(verifiedWarning) verifiedWarning.textContent = validation.message;
    verifiedDisplayEl.textContent = validation.valid
      ? formatVerifiedOnForDisplay(validation.normalized)
      : "----";
    showResourceVerifiedWarning(validation.message);
    return validation.valid;
  }

  if(verifiedBtn && verifiedInput){
    verifiedBtn.onclick = () => {
      verifiedInput.value = formatMMYYFromDate(new Date());
      updateVerifiedDisplayAndWarning();
      verifiedInput.focus();
      verifiedInput.select();
    };
    verifiedInput.addEventListener("input", updateVerifiedDisplayAndWarning);
  }

  const picker = document.getElementById("pdfPicker");
  const attachPdfBtn = document.getElementById("attachPdfBtn");
  if(attachPdfBtn && picker) attachPdfBtn.onclick = () => picker.click();
  if(picker) picker.onchange = async e => {
    const files = Array.from((e.target.files || [])).filter(file => file && (/\.pdf$/i.test(file.name) || file.type === "application/pdf"));
    if(!files.length) return;
    if(!commitPendingEditsIfChanged()) return;

    const current = data.resources[idx];
    if(!current) return;
    normalizeResourcePDFs(current);
    try{
      for(const file of files){
        const id = generateResourceId();
        const key = buildPDFStoragePath(current.id, id, file.name);
        await savePDF(key, file);
        current.pdfs.push({ id, name:file.name || "PDF", path:key });
      }
      current.lastModified = nowISO();
      persist();
      editResource(idx);
    }catch(err){
      alert("Unable to attach PDF: " + err.message);
    }
  };

  pdfSection.querySelectorAll("[data-remove-pdf-id]").forEach(btn => {
    btn.onclick = async () => {
      if(!commitPendingEditsIfChanged()) return;
      const current = data.resources[idx];
      if(!current) return;
      const pdfId = btn.getAttribute("data-remove-pdf-id");
      const removed = removePDFAttachmentFromResource(current, pdfId);
      if(!removed) return;
      try{
        current.lastModified = nowISO();
        persist();
        if(!isPDFPathReferenced(removed.path)){
          await deletePDF(removed.path);
        }
        editResource(idx);
      }catch(err){
        alert("Unable to remove PDF: " + err.message);
      }
    };
  });

  function validateEditorState(){
    const draft = resourceEditorDraft();
    if(!draft){
      showResourceNameWarning("");
      showResourceVerifiedWarning("");
      if(doneBtn) doneBtn.disabled = false;
      return;
    }
    const nameValidation = validateResourceName(draft, idx);
    const verifiedValidation = validateVerifiedOnInput(draft.verifiedOn);
    showResourceNameWarning(nameValidation.message);
    showResourceVerifiedWarning(verifiedValidation.message);
    if(doneBtn) doneBtn.disabled = !(nameValidation.valid && verifiedValidation.valid);
  }

  if(nameEl){
    nameEl.addEventListener("input", validateEditorState);
  }
  if(tagsEl) tagsEl.addEventListener("input", validateEditorState);
  if(updateEl) updateEl.addEventListener("input", validateEditorState);
  if(verifiedInput) verifiedInput.addEventListener("input", validateEditorState);

  updateVerifiedDisplayAndWarning();
  validateEditorState();
  focusAndSelectResourceName();

  editorSnapshot = snapshotResourceEditor();
}

/* ---------- Resource Editor Done Shortcut ---------- */
window.addEventListener("keydown", (e) => {
  const isSelfTestShortcut = e.ctrlKey && e.shiftKey && (e.key === "T" || e.key === "t");
  if(!isSelfTestShortcut) return;
  e.preventDefault();
  e.stopPropagation();
  safeCall("runSelfTests", () => runSelfTests());
}, true);

window.addEventListener("keydown", (e) => {
  if(e.key !== "Escape") return;
  const modal = document.getElementById("referenceModal");
  if(!modal || modal.classList.contains("hidden")) return;
  e.preventDefault();
  e.stopPropagation();
  closeReferenceModal();
}, true);

window.addEventListener("keydown", (e) => {
  const isDoneShortcut = (e.ctrlKey || e.metaKey) && e.key === "Enter";
  if(!isDoneShortcut) return;
  if(!(view === "admin" && adminTab === "resources" && adminResourceEditMode)) return;
  e.preventDefault();
  e.stopPropagation();
  closeResourceEditor();
}, true);

window.addEventListener("keydown", (e) => {
  const activeTag = document.activeElement && document.activeElement.tagName
    ? document.activeElement.tagName.toUpperCase()
    : "";
  if(activeTag === "INPUT" || activeTag === "TEXTAREA") return;

  const isAdminToggleShortcut = e.ctrlKey && e.altKey && (e.code === "KeyA" || e.key === "A" || e.key === "a");
  if(!isAdminToggleShortcut) return;

  e.preventDefault();
  e.stopPropagation();
  setAdminVisibility(!isAdminVisible);
  safeRender();
}, true);

/* ---------- Hidden Favorites Reset Hotkey ---------- */
/*
  Ctrl + Alt + Shift + F  => clear Favorites and reload.
  No confirmation; low stakes.
*/
window.addEventListener("keydown", (e) => {
  const isFavResetCombo =
    e.ctrlKey && e.altKey && e.shiftKey &&
    (e.key === "F" || e.key === "f");

  if (!isFavResetCombo) return;

  e.preventDefault();
  e.stopPropagation();

  localStorage.removeItem("favorites");
  location.reload();
}, true);

/* ---------- Start ---------- */

setAdminVisibility(false);
safeRender();

</script>
