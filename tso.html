<title>Provo TSO Resources</title>

<!-- ===== APP CSS START ===== -->
<style>
body { font-family: -apple-system, sans-serif; margin:0; padding:0; font-size:18px; line-height:1.45; }
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 24px;
  background:#003366;
  color:white;
  position:sticky;
  top:0;
  z-index:50;
}

.topbar .title {
  font-size:20px;
  font-weight:600;
}

.topbar .tabs {
  display:flex;
  gap:24px;
}

.topbar .tabs span {
  cursor:pointer;
  opacity:.9;
}

.topbar .tabs span:hover {
  opacity:1;
}

.hidden { display:none; }
.grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
.category-card, .resource-card { border:1px solid #ddd; padding:12px; border-radius:6px; background:white; }
.resource-card { position:relative; }
.star { position:absolute; left:8px; top:8px; cursor:pointer; font-size:18px; }
.star.fav { color:gold; }
.resource-main { margin-left:24px; }
.resource-details.collapsed { display:none; }
.button { padding:10px 14px; margin:4px 0; cursor:pointer; }
button,
input,
select,
textarea {
  font-size: 18px;
}
.button.primary { background:#003366; color:white; }
.button.secondary { background:#f7f7f7; color:#333; border:1px solid #bbb; }
.button.danger { background:#aa0000; color:white; }
textarea.big { width:100%; min-height:80px; }
textarea.services-editor { min-height:320px; resize:vertical; }
.services-control-block { margin:10px 0 12px; }
.services-control-header {
  margin-bottom:8px;
  padding:10px 12px;
  border:1px solid #ddd;
  border-radius:6px;
  background:#f7f7f7;
}
.services-hint { font-size:16px; color:#555; margin-top:6px; }
.services-preview-toggle { margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.services-control-header .services-preview-toggle { margin-top:0; }
.services-control-header .services-hint { margin-bottom:0; }
.services-preview-toggle .button.primary { box-shadow:0 0 0 2px rgba(0,51,102,0.18); }
.services-preview-box {
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:6px;
  padding:10px;
  background:#fff;
}
.services-rendered ul { margin:6px 0 6px 20px; }
.services-rendered .services-line { margin:0; }
.services-rendered .services-blank { min-height:1.1em; }
.services-rendered hr { border:0; border-top:1px solid #ccc; margin:10px 0; }
.print-list-flyer {
  border:1px solid #ddd;
  border-radius:6px;
  padding:16px;
  margin:18px 0 0;
  background:#fff;
}
.print-list-flyer h2 { margin:0 0 12px; }
.print-list-field { margin:0 0 10px; }
.print-resource-separator { border:0; border-top:1px solid #aaa; margin:14px 0; }
.admin-panel { display:flex; gap:20px; }
.admin-box { flex:1; border:1px solid #ddd; padding:12px; }
.category-grid { display:grid; gap:6px; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
.verified-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.verified-value { font-weight:600; }
.verified-edit { display:none; margin-top:6px; }
.verified-edit.active { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.resource-browse-wrap { width:min(860px,100%); }
.resource-listbox { width:100%; box-sizing:border-box; }
.resource-browse-actions { margin-top:8px; display:flex; gap:8px; align-items:center; width:100%; }
.resource-browse-actions .spacer { flex:1; }
.admin-panel-title { margin:0 0 4px; }
.admin-action-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.admin-option-row { margin:0; }
.admin-option-row + .admin-action-row { margin-top:12px; }
.resource-editor-grid {
  display:grid;
  gap:10px;
  grid-template-columns:repeat(3, minmax(0, 1fr));
}
.resource-editor-grid .span-2 { grid-column:span 2; }
.resource-editor-grid label input,
.resource-editor-grid label textarea { width:100%; box-sizing:border-box; }
#res_name { text-align:left; width:100%; box-sizing:border-box; }
.verified-warning { color:#aa0000; font-size:13px; margin-top:4px; min-height:1.1em; }
.tag-controls-row { margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.assigned-tags-line { font-size:14px; }
.pdf-attachments-list { margin:6px 0 8px; display:grid; gap:6px; }
.pdf-attachment-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.reload-resources-wrap { margin-top:16px; text-align:right; }
.reload-resources-wrap .button { font-size:14px; padding:7px 10px; }
.app-toast {
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:10001;
  max-width:360px;
  padding:12px 14px;
  border:1px solid #c8d6e5;
  border-radius:6px;
  background:#f7fbff;
  color:#1f2d3d;
  box-shadow:0 2px 10px rgba(0,0,0,.14);
  font-size:14px;
  line-height:1.35;
  white-space:pre-line;
}
.app-toast.hidden { display:none; }
.category-order-input { appearance:textfield; -moz-appearance:textfield; }
.category-order-input::-webkit-outer-spin-button,
.category-order-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }

.reference-modal {
  position:fixed;
  inset:0;
  z-index:10002;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  box-sizing:border-box;
  background:rgba(0,0,0,.45);
}
.reference-modal.hidden { display:none; }
.reference-modal-panel {
  width:min(720px,100%);
  max-height:min(82vh,720px);
  display:flex;
  flex-direction:column;
  background:white;
  border:1px solid #c8d6e5;
  border-radius:6px;
  box-shadow:0 8px 28px rgba(0,0,0,.22);
}
.reference-modal-header {
  display:flex;
  justify-content:space-between;
  gap:16px;
  padding:16px 18px;
  border-bottom:1px solid #dde6ef;
}
.reference-modal-title { font-size:20px; font-weight:bold; }
.reference-modal-subtitle { margin-top:2px; color:#555; }
.reference-modal-body {
  padding:16px 18px 18px;
  overflow:auto;
}
.reference-group { margin-top:14px; }
.reference-group:first-child { margin-top:0; }
.reference-group-title { font-weight:bold; margin-bottom:6px; }
.reference-list { margin:0; padding-left:22px; }
.reference-match { margin-bottom:10px; }
.reference-match:last-child { margin-bottom:0; }
.reference-match-name { font-weight:bold; }
.reference-match-categories { color:#555; font-size:14px; }
.reference-match-snippet { margin-top:3px; color:#333; font-size:14px; }
.reference-empty { margin:0; color:#555; }

/* Print modal */
#printModal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  justify-content:center;
  align-items:center;
}
#printModal.hidden { display:none; }
#printContentWrapper {
  background:white;
  padding:20px;
  max-height:90%;
  overflow:auto;
  width:800px;
}
@media print {
  @page {
    margin: 0.75in;
  }

  body {
    background: white;
  }

  body > *:not(#printModal):not(#referenceModal) {
    display: none !important;
  }

  #printModal {
    position: static;
    inset: auto;
    background: transparent;
    display: block;
  }

  #printContentWrapper {
    position: static;
    left: auto;
    top: auto;
    width: auto;
    max-height: none;
    overflow: visible;
    padding: 0;
    margin: 0;
    background: transparent;
    font-size: 11pt;
    line-height: 1.3;
  }

  #printContentWrapper button {
    display: none !important;
  }

  #referenceModal {
    position: static;
    inset: auto;
    display: block;
    padding: 0;
    background: transparent;
  }

  #referenceModal.hidden {
    display: none !important;
  }

  .reference-modal-panel {
    width: auto;
    max-height: none;
    display: block;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
  }

  .reference-modal-header {
    padding: 0 0 12pt;
    margin-bottom: 12pt;
    border-bottom: 1px solid #aaa;
  }

  .reference-modal-title {
    font-size: 16pt;
  }

  .reference-modal-body {
    padding: 0;
    overflow: visible;
    font-size: 11pt;
    line-height: 1.35;
  }

  .reference-modal-close {
    display: none !important;
  }

  .resource-card {
    border: none;
    padding: 0;
    margin-bottom: 11pt;
    break-inside: avoid;
    page-break-inside: avoid;
    background: transparent;
  }

  .resource-card ul {
    margin-top: 4pt;
    margin-bottom: 4pt;
    padding-left: 14pt;
  }

  .print-resource-separator {
    border: 0;
    border-top: 1px solid #999;
    margin: 10pt 0;
  }

  .print-list-flyer {
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0;
    background: transparent;
  }

  .print-list-flyer-page-break {
    break-before: page;
    page-break-before: always;
  }
}
</style>
<!-- ===== APP CSS END ===== -->
</head>

  <strong>TSO Self Tests</strong>
  <div id="selfTestResults"></div>
  <button class="button" id="selfTestClose">Close</button>
</div>

<div id="printModal" class="hidden">

    <div id="printProgress" style="margin:10px 0 12px; font-size:14px; color:#555;"></div>

  </div>
</div>

      "servicesText": "**Provo City School District Adult Education**\nHigh School Diploma: Call 801-374-4840 to earn a credit-based high school diploma through courses at Provo Adult Education.\nGED – Utah High School Completion Diploma: Call 801-374-4840 for GED preparation. The GED test is taken at a UVU testing center.\nCost: $36 per test (4 tests: English, Math, Science, Social Studies).\nLimited vouchers available for those who attend at least 12 hours of class.\nDepartment of Workforce Services (DWFS) may offer resources to pay for the GED exam.\n---\n**Alpine Adult Education** (adulted.alpineschools.org)\nAddress: 778 Bamberger Dr., American Fork, UT 84003\nPhone: 801-610-8188 (Text: 385-269-0809)\nGED Prep (Ages 16+):\nCall to set up an appointment.\nRegister in person with a valid Utah ID.\nTake an assessment test.\nMeet with a teacher/counselor to plan GED goals.\nVouchers available for test fees. Classes are free.\nHigh School Diploma:\nComplete online courses for remaining credits.\n$50 for one-year access to East Shore Online High School.\n---\n**Department of Workforce Services** (jobs.utah.gov)\nResources for GED/HS Diploma:\nFinancial assistance for GED study, tutoring, and testing.\nCash incentives for youth (ages 14–24) who complete GED or HS diploma.\nApply online or in person at a local employment center.\nMeet with an employment counselor to determine eligibility.\nOffices in Provo, Spanish Fork, and Lehi (call 801-526-0950 for all Utah County offices).\nOffices open 8 am–5 pm, Monday–Friday.",

      "servicesText": "**\"Live Your Dream Foundation\"**\n$500 - $3,000 scholarships for single mothers with a dependent at home, applicable to the university, college, or technical school of your choice.\nApplication, deadline to apply, and eligibility requirements can be found at:\nhttp://www.liveyourdreamfoundation.org/apply\nApplication Deadline for Fall 2026: April 10, 2026\n---\n**\"Stella H. Oaks Foundation\"**\nScholarships for single mothers.\nApplication, deadline to apply, and eligibility requirements can be found at:\nhttp://www.stellahoaks.org/scholarship\nApplication Deadline for Summer 2026 Semester: March 14, 2026\nApplication Deadline for Fall 2026 Semester: July 1, 2026\n---\n**\"Ensign College\"**\nScholarships for Ensign College students who are single parents with a dependent child in the home.\nFree Application for Federal Student Aid (FAFSA) is required for domestic students.\nApplication, deadline to apply, and eligibility requirements can be found at:\nmailto:scholarships@ensign.edu\nOr by calling 801-524-8111\nNote: All websites share additional resources for single moms.",

      "servicesText": "Path to Pro (pathtopro.com) \nWould you like training for a career in the trades? Home Depot offers a free, self-paced virtual training platform for learning a trade. Some of the career trades offered are drywall, paint, plumbing, electrical, welding, and others. \nGo to their website pathtopro.com and register online. \nProxima Careers (proximacareers.org) \nInterested in a healthcare pathway? Proxima helps support and get you started in a Certified Nursing Assistant, Medical Assistant, Pharmacy Tech, or Emergency Medical Technician training program at no cost to you. \nEligibility: \nBe 16+ years old \nAble to work in the USA \nAble to work 36+ hours after program completion at one of our employer partners \nFacing barriers to healthcare education \nSee website (proximacareers.org) to sign up or for more information. Openings are limited. \nProvo City School District Adult Education \nAdult Basic Education: (801-374-4840) Adult classes designed to build basic skills in English and Math. \nAdult English Language Learning: (801-374-4904) If English is not a person's first language, the adult English classes provide English instruction. Call first as there is a wait list. Currently, the English classes are given at 750 West 200 North, Provo, until June 2026 when the building will be torn down. \nAlpine Adult Education (adulted.alpineschools.org) \n778 Bamberger Dr., American Fork, UT 84003 \n801-610-8188 (for text only 385-269-0809) \nEnglish Language Learners (ELL) for all levels: \nTo register or get more information, call 801-227-8782. There is a $20 fee plus $10-30 book fees depending on the level. Nursery and/or preschool may be available to those who qualify. Classes in Orem (call 801-227-8782), Eagle Mountain (call 801-610-8897), or Saratoga Springs (call 801-901-0855) for more information or see their website adulted.alpineschools.org. \nCaptain Your Story - My Story Matters \nTools to change yourself and become the person you want to be. If you face: \nFear of the unknown regarding your future. \nGuilt and self-blame for perceived failures. \nFrustration and helplessness in accessing appropriate resources and working with the system. \nAnxiety about the impact of employment on family dynamics and relationships. \nStigma and judgement from social groups, adding to your isolation. \nEmotional exhaustion from constant worry and stress. \nCaptain Your Story teaches core values and life skills. The practices and strategies are research-based. Learning is in person with an instructor, self-guided workbook. You will also be working with a mentor. \nFor more information: \n801-477-7071 \nMystorymatters.org \nmailto:Office@mystorymatters.org \nScholarships available. \nProject Read, Math, and Digital Skills (ProjectReadUtah.org) \nProject Read: Provides small group instruction as well as one-on-one tutoring to help individuals improve their ability to read and write, fill out job applications, create a budget, financial literacy and banking skills, health literacy, workforce prep, civics education. \nProject Math: Everyday math skills. \nProject Digital Skills: Essential computer and software skills, including Windows/Mac OS, Word, Excel, PowerPoint, Google Docs, social media, career search skills, and technology in daily life. \nQualifications: \nAt least 16 years old. \nHave basic English skills. \nRead and write below a high school level. \nProvide proof of Utah residency. \nCommit to 6 instructional hours a week. \nComplete required testing. \nPay associated program fees ($20/year and $20 for use of materials. The $20 materials fee is refundable at the end of the course if all materials are returned). \nScholarships available. \nSubmission form online. Call 801-448-7323 if you need help filling out. \nProject Read Office in Provo Library: \n550 North University Ave. Room #215, Provo, UT 84601 \n801-448-7323 \nHours: Tuesday - Thursday 10 am - 7 pm. \nFriday 10 am - 4 pm. \nMountainland Technical College (mtec.edu) \nOffering classes in: \nHealthcare (EMT, Dental Asst., Medical Asst., Pharmacy Tech, and more) \nServices (Cosmetology, Culinary Arts, Nail Tech and more) \nTrades (Automotive, Diesel, Welding, Commercial Driver's License, etc) \nTechnology (Information Tech, Web Programming, etc.) \nApprenticeships (Electrical, HVACR Tech, Plumbing) \n\"Information Sessions\" in person or virtual. Covers financial information, registration info, program details, scholarship info etc. Sign up on their website, opening page \"View Session Dates\". \nCampuses in Lehi, Orem, Provo, Spanish Fork, Payson. \nFor more information, fill out the form online under \"contact\" or call 801-753-6282. Or register and attend an \"Information Session\" as mentioned above. \nDepartment of Workforce Services (jobs.utah.gov) \nIf you are seeking an occupational license or professional certification DWFS may be able to help with the following resources: \nPaying for tuition, books, and required supplies. \nPaying required testing and licensing fees. \nConnecting with and paying for tutoring services, personalized coaching and financial support including applying for financial aid and navigating post-secondary education. \nCash incentives for youth for completion of program. \nApprenticeship opportunities: DWFS may be able to help find and research apprenticeship programs as well as provide funding for classroom training and required supplies. \nCompleting a College Degree: Paying for tuition, books and required supplies as well as resources listed above. \nPaid internship opportunities to explore careers and gain workplace skills. Career assessment. \nHow to apply: \nGo to jobs.utah.gov/career. Select the service or support you are interested in. \nClick \"How to Apply\" and then \"Apply Now\" to apply online. \nIf you do not have a Utah ID account, you will need to create one. \nOr visit the nearest DWFS Employment Center. \nTo receive funding you must meet eligibility requirements which vary based on program. \nCall 801-526-0950 (for all Utah County offices) for more information or go online to jobs.utah.gov. \nOffices open 8 am-5pm Monday-Friday in: \n1550 North 200 West (Provo 84604) \n1185 N. Canyon Creek Parkway (Spanish Fork 84660) \n557 West State St. (Lehi 84043 ",

      "servicesText": "---\n**Path to Pro** (pathtopro.com)\nWould you like training for a career in the trades? Home Depot is offering a free, self‑paced virtual training platform for learning a trade. Some of the career trades offered are drywall, paint, plumbing, electrical, welding and others. Go to their website pathtopro.com and register online.\n---\n**Proxima Careers** (proximacareers.org)\nInterested in a healthcare pathway? Proxima helps support and get you started in a Certified Nursing Assistant, Medical Assistant, Pharmacy Tech, or Emergency Medical Technician training program at no cost to you.\nEligibility:\n* Be 16+ years old\n* Able to work in the USA\n* Able to work 36+ hours after program completion at one of our employer partners\n* Facing barriers to healthcare education\nSee website to sign up. Openings are limited.\nLocations mentioned:\nSpanish Fork 84660\n557 West State St. (Lehi 84043)\n---\n**Mountainland Technical College** (mtec.edu)\nOffering classes in:\n* Healthcare (EMT, Dental Asst., Medical Asst., Pharmacy Tech, and more)\n* Services (Cosmetology, Culinary Arts, Nail Tech and more)\n* Trades (Automotive, Diesel, Welding, CDL, etc.)\n* Technology (Information Tech, Web Programming, etc.)\n* Apprenticeships (Electrical, HVACR, Plumbing)\n“In‑person or virtual” Information Sessions cover financial info, registration, program details, scholarships, etc. Sign up on their website (opening page → “View Session Dates”).\nCampuses: Lehi, Orem, Provo, Spanish Fork, Payson.\nFor more information:\nFill out the online contact form\nCall 801‑753‑6282\nOr attend an Information Session\n---\n**Department of Workforce Services – DWS** (jobs.utah.gov)\nIf you are seeking an occupational license or professional certification, DWS may help with:\n* Tuition, books, and supplies\n* Testing and licensing fees\n* Tutoring services\n* Personalized coaching\n* Financial aid navigation\n* Cash incentives for youth\n* Apprenticeship funding (classroom training + supplies)\n* Degree completion support\n* Paid internships\n* Career assessment\nHow to apply:\nGo to jobs.utah.gov/career\nSelect the service/support\nClick How to Apply → Apply Now\nCreate a Utah ID if needed\nOr visit a local DWS office\nEligibility depends on the program.\nPhone: 801‑526‑0950\nUtah County offices:\n1550 North 200 West (Provo 84604)\n1185 N. Canyon Creek Parkway (Spanish Fork 84660)\n557 West State St. (Lehi 84043)\nHours: Mon–Fri, 8am–5pm\n---\n**Job Corps** (enroll.jobcorps.gov)\nJob Corps is the largest free residential education and job‑training program for young adults (ages 16–24) who are disadvantaged, low income, disabled, homeless, etc.\nCenters house 120–240 students, except Clearfield (~1,000).\nZero tolerance for drugs/alcohol.\nCenter assigned based on chosen trade.\nApplication:\nApply at enroll.jobcorps.gov\nApplication goes to an admissions counselor based on ZIP code\nProcessing time: ~2 months\nExpedited for applicants without housing\nCourt‑related requirements must be complete (if applicable)\nDocumentation (if applicable):\n* Transcripts/Diploma\n* Immunization Record\n* Background check\n* ID/Birth Certificate/Social Security Card\n* Medicaid/Insurance card\n* Mental health diagnosis/IEP\n* Income (past 6 months): SNAP, SSI/SSDI, Medicaid, free/reduced lunch\nIncluded:\n* Furnished dorms\n* Work clothing\n* Basic medical care\n* Living allowance ($45–$70 every 2 weeks after 6 months)\n* Books and supplies\nFree Training:\n* High school diploma\n* Driver’s education\n* Personal career development\n* Fundamental employment skills\n* Tutoring: English, Math, Reading\nClasses offered: Carpentry, welding, electrical, forestry, firefighting, automotive, plumbing, medical, dental, and more.\nFor questions: 801‑479‑9806",

      "servicesText": "---\n**LG Resources** (LGresources.com)\n363 N. University Ave. Suite 101, Provo, UT 84601\n801-900-4726 (text to 385-501-7701)\nMainly temp to hire positions, occasional temp for a few days\nJobs: General labor (cleanup at construction sites, warehouse, light industrial, janitorial, landscaping, clerical, welders, HVAC, electrical)\nMust have 1 year of experience and resume\nComplete application online, contact the office for an interview between 9-4\nBackground checks and drug screens required. In some cases, medical marijuana use is OK—bring your card to the interview. Exiting incarceration may be OK depending on the offense and how recently they were jailed.\n---\n**Apex Staffing** (apexjobs.net)\n1160 S. State St. Suite 220, Orem, UT 84097\nConstruction and industrial jobs\nApplications accepted Monday–Friday 9 am–2 pm\nFT, PT, short and long term temporary staffing as well as temp to hire staffing\nFriendly to those exiting corrections\n---\n**Ascend Staffing** (ascendstaffing.com)\n1651 N. State St., Orem, UT 84057\n801-374-8000\nRequire GED or HS diploma\nAble to work in US\nExcellent communication skills\nBackground check\nFT, PT paid weekly\nLight industrial and skilled trades 1\n---\n**Elwood Staffing** (Elwoodstaffing.com)\n4 offices offering positions in general labor, construction, warehouse production and shipping, manufacturing, and skilled labor jobs (carpentry, welding, etc.)\nMost jobs require no experience (skilled labor jobs prefer experience and a resume)\nAll offices open 9–5, M–F. Complete an online account and applications before job search\nAlmost every job requires a background check (generally “second chance” friendly) and drug screen. Medical marijuana users will not qualify due to THC in the test\nJobs may be short in duration or temp to hire\nEligibility Requirements:\nMust have transportation (many places not serviced by UTA)\nWarehouse jobs are usually shift work—ability to work all shifts\nMany require steel toe boots, ability to lift 50 lbs or more, and clothing appropriate for outdoor work\nOffices:\nElwood Skill Staff: 1256 S. State St. #104, Orem, UT 84057, 801-426-4948 (skilled trades)\nElwood Staffing: 1256 S. State St. #101, Orem, UT 84057, 801-225-1010 (warehouse, production, shipping in Provo/Orem)\nElwood Staffing – American Fork: 72 South 360 East, American Fork, UT 84003, 801-492-1525 (production/warehouse jobs in Lindon and north Utah County)\nElwood Staffing – Spanish Fork: 61 East 1000 North, Spanish Fork, UT 84660, 801-798-0052 (warehouse/production jobs in Springville and south Utah County) 1\n---\n**Utah Construction Personnel** (UCPStaffing.com)\n590 N. State St., Orem, UT 84057\n801-227-7171\nConstruction and general labor jobs. Must be drug free. Veteran friendly\n---\n**Nexeo Staffing** (Nexeostaffing.com)\n1417 S. State St., Orem, UT 84057\n801-841-4000\nFT, PT, Temporary: warehouse, customer service, accounting, admin, clerical, construction, welding. Many jobs want a resume. Nexeo will help you prepare one if needed\nGenerally paid weekly\nBackground check and drug screen if required by client\nAdditional Utah locations—see website\n---\n**Kelly Services** (Kellyservices.us)\n2255 N. University Parkway Suite 7, Provo, UT 84604\n801-373-1616\nSubstitute teachers, light industrial, electronic assembly, professional\nBackground checks and drug screens as required by employer\nFT, PT, Temporary\n---\n**Indeed.com**\nCreate an account online to see your job recommendations\nFilter by pay, job type, experience level, education, etc.",

      "servicesText": "---\n**People Ready** (PeopleReady.com)\nLocation: 175 S. Freedom Blvd. Provo, UT 84601\nPhone: 801-561-0881\nEmail: mailto:1432-br@peopleready.com\nType: Temporary employment agency for general labor, construction, hospitality, retail, manufacturing, warehouse/distribution, housekeeping/janitorial, disaster restoration, and more.\nFeatures:\nBuild your own schedule.\nMany jobs offer next-day pay.\nPayment via direct deposit, check, or pay card.\nRequirements:\nSmartphone to download the “Jobstack” app (for applying and job notifications).\nTwo forms of ID (e.g., non-expired picture ID, Social Security card, jail release papers, birth certificate).\nMay need steel toe shoes and long pants for most jobs.\n---\n**Bacon** (Baconwork.com)\nType: On-demand work—pick up shifts when you want using the “Baconwork OnDemand” app.\nFeatures:\nView shift details (company, time, pay, type of work).\nFlexible, temporary work (event staffing, catering, warehouse, general labor, etc.).\nNo specific skill required—just willingness to work hard.\nYou control your schedule.\nAfter each shift, you’re rated (1–5 stars); payment follows rating.\n---\n**GigSmart** Get Gigs App (Gigsmart.com)\nType: On-demand temporary or residential project work; full and part-time jobs.\nHow it works:\nDownload the app and create a work profile.\nBrowse and apply for positions based on your interests and experience.\nAccept shifts that suit you.\nEarnings are transferred automatically after timesheet approval.\n---\n**Department of Workforce Services** (jobs.utah.gov)\nApp: “Utah Jobs” mobile app.\nFeatures:\nSet up an account entirely on the app.\nSearch jobs easily.\nTarget jobs by area and keywords.\nAdd jobs to favorites or remove those you’re not interested in.\n---\n**Rover App** (Rover.com)\nType: Become a pet sitter (dogs and cats only).\nFeatures:\nSet your own schedule and prices.\nGet paid two days after a completed service.\nMust pass a background check.\nHow to get started:\nDownload the “Rover” app.\nChoose services (pet boarding, house sitting, dog walking, drop-in visits, doggy daycare, dog training).\nSet rates, availability, and pet preferences.\nCreate your profile (experience, etc.).\nRequest testimonials from past clients.\nComplete a safety quiz and background check.",

      "servicesText": "---\n**DAYTIME**\n---\n**St. Vincent De Paul Dining Hall and Weigand Resource Center Day Shelter**\n437 W. 200 S., Salt Lake City\n(801) 363-7710\nOpen 7 AM–7 PM daily (closed on holidays)\nServices: case management, storage, hygiene, showers, laundry, computer lab, clothing\nMeals (for those at/below 185% federal poverty line):\nMon–Fri: Lunch 11:30 AM–12:30 PM, Dinner 5–6 PM\nSat: Brunch 10–11 AM, Dinner 5–6 PM\nSun: Dinner 5–6 PM\n---\n**FOR WOMEN**\n---\n**Geraldine E. King Women's Resource Center** (18+ years)\n131 E. 700 S., Salt Lake City\n(801) 990-9999 (Homeless Connections Hotline for Intake)\nGo in person 7–9:30 AM to get on bed list; most vulnerable prioritized\nOpen 24/7, 365 days/year\nServices: meals, clothing, hygiene, showers, laundry, outreach team (Mon–Fri 9 AM–5 PM: 801-503-4116 or 385-421-8455)\nMeals: Breakfast 8–9 AM, Lunch 1–2 PM, Dinner 5:30–6:30 PM\n**Rescue Mission of Salt Lake Women's Center** (women and children)\n1165 S State Street, Salt Lake City\n(801) 521-5925\nOpen 365 days/year\nServices: emergency shelter, food, hygiene, clothing, work therapy, life skills, addiction recovery\n---\n**FOR YOUTH**\n---\n**Youth Resource Center – Volunteers of America** (ages 15–22)\n888 S. 400 W., Salt Lake City\n(801) 364-0744 ext. 707\nOpen 24/7; intake during drop-in hours 8:30 AM–6 PM\nServices: 3 meals/day, pantry food, showers, laundry, life-skills, housing/employment case management, dental/medical/mental health\nEmergency shelter: 7:30 PM–8:30 AM (30 beds)\n---\n**Youth Futures** (ages 12–18)\nOgden: 2760 Adams Ave., Ogden\nCedar City: 100 W. 133 S., Cedar City\nSt. George: 340 E. Tabernacle, St. George\nCall: 801-528-1214\nOpen 24/7; case management 6 AM–8 PM\nServices: overnight shelter, food, clothing, hygiene, laundry, computer, case management\n---\n**FOR MEN**\n---\n**Pamela Atkinson Men's Resource Center (single men 18+)**\n3380 S. 1000 W., South Salt Lake\n(801) 359-4142 or UCA Bed Intake Line 801-990-9999\nOp       "servicesText": "---\n**Resources for Women who are Pregnant**\n---\n**Emergency Medicaid** (For Delivery Costs)\nUtah offers Emergency Medicaid for non-citizens (including undocumented immigrants) who meet income requirements.\nCoverage: This covers labor and delivery charges for the mother.\nEligibility: Must be a Utah resident, have low/zero income, and meet the financial criteria for regular Medicaid.\nApplication: The mother can apply one month before the expected delivery date.\nBaby's Coverage: An infant born to a mother on Emergency Medicaid is eligible for full Medicaid for their first year.\n---\n**Hospital Charity Care & Financial Assistance**\n---\n**Non-profit hospitals in Utah (such as Intermountain Health and CommonSpirit Health (Holy** ** Cross Health) are legally required to have financial assistance policies.**\nUtah Valley Hospital in Provo, American Fork Hospital, Orem Community Hospital, and Holy Cross Hospital- Mountain Point in Lehi are non-profit hospitals.\nAction: Contact the hospital's billing department immediately to apply for \"charity care\" or \"financial assistance\".\nEligibility: Generally based on income. Families with zero income likely qualify for 100% forgiveness of the bill.\nProcess: They will need to fill out an application, likely providing a letter explaining their current financial status.\nUninsured Discount: If they do not qualify for Medicaid, hospitals often offer automatic discounts for uninsured patients.\n---\n**\"Baby Your Baby\"** (For Prenatal Care)\nBaby Your Baby (BYB) is a Utah program that provides temporary Medicaid for low-income pregnant women.\nWhile BYB primarily covers outpatient prenatal care, the application process acts as a bridge to other, more comprehensive coverage.\nAction: Call the Baby Your Baby hotline at 1-800-826-9662.",

      "servicesText": "---\n**Phone and Internet Service**\n---\n**Lifeline Phone and Internet Service**\nA Federal program that provides discounted telephone service or discounted internet service through contracted service providers to low-income individuals and families.\nLifeline pays up to $9.25 towards a monthly phone, internet, or bundled service bill, or up to $34.25 per month for Tribal households.\nYou may be eligible to get Lifeline if:\nYour income is 135% or less of the federal poverty guidelines, or\nYou participate in a government assistance program such as SNAP, Medicaid, SSI, Federal public housing assistance, National School Lunch Program, or a Tribal specific program.\nHow to sign up:\nSign up at https://www.lifelinesupport.org.\nAfter you qualify, choose a phone or internet company near you and sign up for service with them.\nYou can also sign up via mail (see lifelinesupport.org), or with a participating wireless provider.\n---\n**Phone companies working with Lifeline:**\n(Some offer free service, free phones, or low-cost plans. Check online first to see if you are eligible or do the qualification process directly with one of the wireless companies.)\n* Airtalk Wireless (https://airtalkwireless.com/my-state/Utah)\n* Assurance Wireless (https://assurancewireless.com) 1-888-321-5880\n* Tru Connect (https://truconnect.com) 1-800-430-0443\n* EnTouch Wireless (https://apply4lifeline.Entouchwireless.com) 1-888-594-0579\n* Life Wireless (https://lifewireless.com) 1-888-543-3620\n* Safelink Wireless (https://safelinkwireless.com)\n* Stand Up Wireless (https://standupwireless.com) 1-800-234-9473\n---\n**Low-cost Internet Providers**\nAs low as $15/month. Based on Lifeline eligibility rules (see above). Check for availability in your area online. Applications online.\n* Xfinity \"Internet Essentials\" (https://xfinity.com/learn/internet-service/internet-essentials)\n* AT&T \"Access\" (https://att.com/access)\n* Spectrum \"Internet Assist\" (https://spectrum.com/internet/spectrum-internet-assist)\n* T-Mobile: \"Project 10 Million\" – Free Internet Access for eligible K-12 Students\nBenefits: Free mobile hotspot and Free 200GB of internet per year for 5 years.\nEligibility: K-12 students enrolled in one of the following: SNAP, Medicaid, National School Lunch Program, or Food Distribution Program on Indian Reservation.\nTo apply: Visit https://t-mobile.com/brand/project-10-million\nMust have proof of participation in one of the government programs listed above.",

function nowISO(){ return new Date().toISOString(); }
function escapeHTML(str){ return (str||"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;" }[m])); }
function normalizeWebsiteURL(url){
  const trimmed = typeof url === "string" ? url.trim() : "";
  if(!trimmed) return "";
  if(/^https?:\/\//i.test(trimmed)) return trimmed;
  return `https://${trimmed}`;
}
function generateResourceId(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes)
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");
}

function filenameFromPath(path){
  const clean = String(path || "").split(/[?#]/)[0];
  return clean.split("/").filter(Boolean).pop() || "";
}

function safePDFFileName(name){
  const fallback = "attachment.pdf";
  const base = filenameFromPath(name) || fallback;
  const safe = base.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "") || fallback;
  return /\.pdf$/i.test(safe) ? safe : `${safe}.pdf`;
}

function stablePDFIdFromPath(path, fallback = "pdf"){
  const text = String(path || fallback);
  let hash = 2166136261;
  for(let i = 0; i < text.length; i += 1){
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return `pdf-${(hash >>> 0).toString(16)}`;
}

function pdfNameFromPath(path){
  return filenameFromPath(path) || "PDF";
}

function buildPDFStoragePath(resourceId, attachmentId, fileName){
  return `pdfs/${encodeURIComponent(resourceId || "resource")}/${attachmentId}-${safePDFFileName(fileName)}`;
}

function showToast(message){
  let toast = document.getElementById("appToast");
  if(!toast){
    toast = document.createElement("div");
    toast.id = "appToast";
    toast.className = "app-toast hidden";
    toast.setAttribute("role", "status");
    toast.setAttribute("aria-live", "polite");
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.remove("hidden");
  if(showToast.timer) clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => {
    toast.classList.add("hidden");
  }, 4500);
}

// ============================================================
// DATA NORMALIZATION
// ============================================================
// Normalize legacy/imported records into a single canonical shape so rendering,
// editing, and persistence logic only handle one schema.

function normalizeResourceServices(r){
  // Canonical: servicesText string. Legacy: services array of lines.
  if(!r || typeof r !== "object") return false;
  if(typeof r.servicesText === "string"){
    delete r.services;
    return false;
  }
  if(Array.isArray(r.services)){
    r.servicesText = r.services.join("\n");
    delete r.services;
    return true;
  }
  if(!r.servicesText) r.servicesText = "";
  return false;
}

function normalizeResourceVerifiedOn(r){
  // Canonical: verifiedOn in MM/YY (or null). Legacy aliases are consumed then removed.
  if(!r || typeof r !== "object") return;
  const preferred = coerceVerifiedOnToMMYY(r.verifiedOn);
  if(preferred){
    r.verifiedOn = preferred;
  }else{
    const legacyReviewed = coerceVerifiedOnToMMYY(r.reviewedOn);
    const legacyVerifiedDate = coerceVerifiedOnToMMYY(r.verifiedDate);
    r.verifiedOn = legacyReviewed || legacyVerifiedDate || null;
  }
  if("reviewedOn" in r) delete r.reviewedOn;
  if("verifiedDate" in r) delete r.verifiedDate;
}

function normalizeResourcePDFs(r){
  // Canonical: pdfs array of { id, name, path }. Legacy pdf path is preserved.
  if(!r || typeof r !== "object") return;
  const attachments = [];
  const seenPaths = new Set();

  if(Array.isArray(r.pdfs)){
    r.pdfs.forEach((pdf, index) => {
      if(!pdf || typeof pdf !== "object") return;
      const path = typeof pdf.path === "string" ? pdf.path.trim() : "";
      if(!path || seenPaths.has(path)) return;
      seenPaths.add(path);
      const id = String(pdf.id || "").trim() || stablePDFIdFromPath(`${path}:${index}`);
      attachments.push({
        id,
        name: String(pdf.name || pdfNameFromPath(path)).trim() || "PDF",
        path
      });
    });
  }

  const legacyPath = typeof r.pdf === "string" ? r.pdf.trim() : "";
  if(legacyPath && !seenPaths.has(legacyPath)){
    attachments.push({
      id: stablePDFIdFromPath(legacyPath),
      name: pdfNameFromPath(legacyPath),
      path: legacyPath
    });
  }

  r.pdfs = attachments;
  if(typeof r.pdf !== "string" && "pdf" in r) delete r.pdf;
}

function normalizeDataServicesShape(data){
  if(!data.resources) return;
  data.resources.forEach(normalizeResourceServices);
}

function normalizeDataPDFShape(nextData){
  if(!nextData || !Array.isArray(nextData.resources)) return;
  nextData.resources.forEach(normalizeResourcePDFs);
}

function normalizeDataVerifiedOnShape(nextData){
  if(!nextData || !Array.isArray(nextData.resources)) return;
  nextData.resources.forEach(normalizeResourceVerifiedOn);
}

function formatMMYYFromDate(d){
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yy = String(d.getFullYear()).slice(-2);
  return `${mm}/${yy}`;
}

function formatDateOnly(isoString){
  if(!isoString) return "(none)";
  const date = new Date(isoString);
  if(Number.isNaN(date.getTime())) return String(isoString);
  return date.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
}

function formatDateTimeUTC(isoString){
  if(!isoString) return "(none)";
  const date = new Date(isoString);
  if(Number.isNaN(date.getTime())) return String(isoString);
  const month = date.toLocaleString(undefined, { month:"long", timeZone:"UTC" });
  const day = date.getUTCDate();
  const year = date.getUTCFullYear();
  const hour = date.getUTCHours();
  const minute = String(date.getUTCMinutes()).padStart(2, "0");
  return `${month} ${day}, ${year}, ${hour}:${minute} UTC`;
}

function parseMMYYToMonthIndex(mmyy){
  const match = String(mmyy || "").trim().match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
  if(!match) return null;
  const month = Number(match[1]);
  const yy = Number(match[2]);
  const year = 2000 + yy;
  return year * 12 + (month - 1);
}

function isValidMMYY(value){
  return parseMMYYToMonthIndex(value) !== null;
}

function formatVerifiedOnForDisplay(verifiedOn){
  return isValidMMYY(verifiedOn) ? String(verifiedOn).trim() : "----";
}

function parseLegacyVerifiedOnToMMYY(raw){
  const text = String(raw || "").trim();
  if(!text) return null;

  const mmyy = text.match(/^(\d{1,2})[\/\-](\d{2})$/);
  if(mmyy){
    const month = Number(mmyy[1]);
    const yy = Number(mmyy[2]);
    if(month >= 1 && month <= 12) return `${String(month).padStart(2,"0")}/${String(yy).padStart(2,"0")}`;
  }

  const withYear = text.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2}|\d{4})$/);
  if(withYear){
    const month = Number(withYear[1]);
    const yearRaw = withYear[3];
    if(month >= 1 && month <= 12){
      const yy = yearRaw.length === 4 ? Number(yearRaw.slice(-2)) : Number(yearRaw);
      return `${String(month).padStart(2,"0")}/${String(yy).padStart(2,"0")}`;
    }
  }

  const compact = text.match(/^(\d{2})(\d{2})(\d{2})$/);
  if(compact){
    const month = Number(compact[1]);
    const yy = Number(compact[3]);
    if(month >= 1 && month <= 12) return `${compact[1]}/${String(yy).padStart(2,"0")}`;
  }

  if(/^\d{4}-\d{2}-\d{2}$/.test(text)){
    const isoDate = new Date(`${text}T00:00:00`);
    if(!Number.isNaN(isoDate.getTime())) return formatMMYYFromDate(isoDate);
  }

  const parsed = new Date(text);
  if(!Number.isNaN(parsed.getTime())) return formatMMYYFromDate(parsed);
  return null;
}

function coerceVerifiedOnToMMYY(value){
  if(value == null) return null;
  const text = String(value).trim();
  if(!text) return null;
  if(isValidMMYY(text)) return text;
  const parsed = parseLegacyVerifiedOnToMMYY(text);
  return parsed && isValidMMYY(parsed) ? parsed : null;
}

function validateVerifiedOnInput(value){
  const text = String(value || "").trim();
  if(!text) return { valid:true, normalized:null, message:"" };
  if(!isValidMMYY(text)){
    return { valid:false, normalized:null, message:"Use MM/YY (MM 01-12)." };
  }
  return { valid:true, normalized:text, message:"" };
}

function compareResourcesByName(a, b){
  return String((a && a.name) || "").localeCompare(String((b && b.name) || ""), undefined, { sensitivity:"base" });
}

function getAdminResourceBrowseList(){
  const resources = data.resources.slice();
  if(!adminShowVerifiedDates){
    return resources.sort(compareResourcesByName);
  }
  return resources.sort((a, b) => {
    const aMonth = parseMMYYToMonthIndex(a.verifiedOn);
    const bMonth = parseMMYYToMonthIndex(b.verifiedOn);
    const aVerified = aMonth !== null;
    const bVerified = bMonth !== null;
    if(aVerified !== bVerified) return aVerified ? -1 : 1;
    if(aVerified && bVerified && aMonth !== bMonth) return aMonth - bMonth;
    return compareResourcesByName(a, b);
  });
}

function buildAdminDeleteConfirmation(kind, name){
  if(kind === "resource"){
    return [
      `Are you sure you want to delete the resource '${name}'?`,
      "",
      "This removes it from all categories and Favorites.",
      "Undo will be available in Admin to restore what you deleted."
    ].join("\n");
  }
  if(kind === "category"){
    return [
      `Are you sure you want to delete the category '${name}'?`,
      "",
      "Resources are not deleted, but they will no longer appear under this category.",
      "Undo will be available in Admin to restore what you deleted."
    ].join("\n");
  }
  return "Are you sure?";
}

function canonicalizeResourceTag(tag){
  const trimmed = String(tag || "").trim();
  const key = trimmed.toLowerCase();
  if(
    key === "this resource is a list" ||
    key === "this is a list" ||
    key === "list resource"
  ){
    return "List";
  }
  return trimmed;
}

function normalizeResourceTags(tags){
  const normalized = [];
  const seen = new Set();
  const source = Array.isArray(tags)
    ? tags
    : (typeof tags === "string" ? tags.split(/[,\n]/) : []);

  source.forEach(rawTag => {
    if(typeof rawTag !== "string" && typeof rawTag !== "number") return;
    const tag = canonicalizeResourceTag(rawTag);
    if(!tag) return;
    const key = tag.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    normalized.push(tag);
  });
  return normalized;
}

function parseResourceTagsInput(value){
  return normalizeResourceTags(String(value || "").split(/[,\n]/));
}

function normalizeDataTagsShape(nextData){
  if(!nextData || typeof nextData !== "object") return;
  if(!Array.isArray(nextData.tags)) nextData.tags = [];
  nextData.tags = [];

  if(!Array.isArray(nextData.resources)) return;
  nextData.resources.forEach(r => {
    r.tags = normalizeResourceTags(r.tags);
  });
}

function getAllTags(excludeResourceId = ""){
  const tags = [];
  const seen = new Set();
  (Array.isArray(data.resources) ? data.resources : []).forEach(resource => {
    if(excludeResourceId && String(resource && resource.id || "") === String(excludeResourceId)) return;
    normalizeResourceTags(resource && resource.tags).forEach(tag => {
      const key = tag.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      tags.push(tag);
    });
  });
  return tags.sort((a,b)=>a.localeCompare(b, undefined, { sensitivity:"base" }));
}

const TAG_CATEGORY_HINTS = [
  {
    categoryLabel: "Housing",
    tags: ["Shelter", "Rental", "Subsidized Housing", "Eviction Help", "Hotel/Motel", "Room for Rent", "Rent/Mortgage Assistance"]
  },
  {
    categoryLabel: "Employment",
    tags: ["Temp Agency", "Employment Agency", "Employment Counseling", "Career/Vocational Training", "Apprenticeship", "Ex-Offender Support"]
  },
  {
    categoryLabel: "Education",
    tags: ["Career/Vocational Training", "GED", "Scholarships", "Apprenticeship"]
  }
];

function getSuggestedCategoriesFromTags(tags){
  const tagKeys = new Set(normalizeResourceTags(tags).map(tag => tag.toLowerCase()));
  return TAG_CATEGORY_HINTS
    .filter(hint => hint.tags.some(tag => tagKeys.has(canonicalizeResourceTag(tag).toLowerCase())))
    .map(hint => hint.categoryLabel);
}

function findCategoryByLabelOrId(label){
  const key = String(label || "").trim().toLowerCase();
  return (Array.isArray(data.categories) ? data.categories : [])
    .find(cat => String(cat && cat.label || "").trim().toLowerCase() === key || String(cat && cat.id || "").trim().toLowerCase() === key);
}

function getMissingSuggestedCategories(draft){
  const selected = new Set(Array.isArray(draft && draft.categories) ? draft.categories.map(String) : []);
  return getSuggestedCategoriesFromTags(draft && draft.tags)
    .filter(label => {
      const category = findCategoryByLabelOrId(label);
      return category && !selected.has(String(category.id || ""));
    });
}

function formatCategoryList(labels){
  if(labels.length <= 1) return labels[0] || "";
  if(labels.length === 2) return `${labels[0]} and ${labels[1]}`;
  return `${labels.slice(0, -1).join(", ")}, and ${labels[labels.length - 1]}`;
}

function confirmCategoryAssignmentHint(draft){
  const missing = getMissingSuggestedCategories(draft);
  if(!missing.length) return true;
  const categoryList = formatCategoryList(missing);
  const categoryPhrase = missing.length === 1 ? "that category is" : "those categories are";
  return confirm(`This resource has tags suggesting ${categoryList}, but ${categoryPhrase} not selected. Continue?`);
}

function getResourcePDFs(resource){
  normalizeResourcePDFs(resource);
  return Array.isArray(resource.pdfs) ? resource.pdfs : [];
}

function collectPDFPathsFromResource(resource, { includeLegacy = true } = {}){
  if(!resource || typeof resource !== "object") return [];
  const paths = [];
  const seen = new Set();
  getResourcePDFs(resource).forEach(pdf => {
    const path = typeof pdf.path === "string" ? pdf.path.trim() : "";
    if(!path || seen.has(path)) return;
    seen.add(path);
    paths.push(path);
  });
  if(includeLegacy && typeof resource.pdf === "string"){
    const legacyPath = resource.pdf.trim();
    if(legacyPath && !seen.has(legacyPath)) paths.push(legacyPath);
  }
  return paths;
}

function collectPDFPathsFromResources(resources){
  const paths = [];
  const seen = new Set();
  (Array.isArray(resources) ? resources : []).forEach(resource => {
    collectPDFPathsFromResource(resource).forEach(path => {
      if(seen.has(path)) return;
      seen.add(path);
      paths.push(path);
    });
  });
  return paths;
}

function removePDFAttachmentFromResource(resource, pdfId){
  if(!resource || typeof resource !== "object") return null;
  normalizeResourcePDFs(resource);
  const removed = resource.pdfs.find(pdf => pdf.id === pdfId);
  if(!removed) return null;
  resource.pdfs = resource.pdfs.filter(pdf => pdf.id !== pdfId);
  if(typeof resource.pdf === "string" && resource.pdf.trim() === removed.path){
    delete resource.pdf;
  }
  return removed;
}

function isPDFPathReferencedInResources(resources, path){
  const key = String(path || "").trim();
  if(!key) return false;
  return (Array.isArray(resources) ? resources : []).some(resource => collectPDFPathsFromResource(resource).includes(key));
}

function isPDFPathReferenced(path){
  return isPDFPathReferencedInResources(data.resources || [], path);
}

function applyServicesBold(escapedText){
  return escapedText.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

function renderServicesHTML(text){
  const normalized = String(text || "").replace(/\r\n?/g, "\n");
  const lines = normalized.split("\n");
  const out = [];
  let listItems = [];

  function flushList(){
    if(!listItems.length) return;
    out.push(`<ul>${listItems.join("")}</ul>`);
    listItems = [];
  }

  lines.forEach(line => {
    const trimmed = line.trim();
    const isDivider = trimmed === "---";
    const bulletMatch = line.match(/^\s*(?:\*|-|•)\s+(.*)$/);

    if(isDivider){
      flushList();
      out.push("<hr>");
      return;
    }

    if(bulletMatch){
      const bulletText = applyServicesBold(escapeHTML(bulletMatch[1]));
      listItems.push(`<li>${bulletText}</li>`);
      return;
    }

    flushList();
    if(line === ""){
      out.push('<div class="services-line services-blank">&nbsp;</div>');
      return;
    }
    out.push(`<div class="services-line">${applyServicesBold(escapeHTML(line))}</div>`);
  });

  flushList();
  return out.join("");
}

// ============================================================
// SAFETY HARNESS
// ============================================================
// Catch runtime errors and (when debug is enabled) enforce invariants to prevent
// silent corruption during edits, imports, and rendering.

function showAppError(context, err){
  const banner = document.getElementById("appErrorBanner");
  const details = document.getElementById("appErrorDetails");
  if(!banner || !details) return;

  const message = err && err.message ? String(err.message) : String(err || "Unknown error");
  const stack = err && err.stack ? String(err.stack) : "";
  const timestamp = new Date().toISOString();
  details.textContent = [
    `Context: ${context}`,
    `Message: ${message}`,
    `Timestamp: ${timestamp}`,
    stack ? `Stack:\n${stack}` : ""
  ].filter(Boolean).join("\n");
  banner.style.display = "block";
}

function safeCall(label, fn){
  try{
    return fn();
  }catch(err){
    showAppError(label, err);
    return undefined;
  }
}

function assertInvariants(context = "invariant check"){
  if(!data || !Array.isArray(data.resources)) throw new Error(`${context}: data.resources must be an array`);
  if(!Array.isArray(data.categories)) throw new Error(`${context}: data.categories must be an array`);
  if(!Array.isArray(favorites)) throw new Error(`${context}: favorites must be an array`);

  const ids = new Set();
  data.resources.forEach((resource, idx) => {
    const id = String(resource && resource.id || "");
    if(!id) throw new Error(`${context}: resource at index ${idx} is missing id`);
    if(ids.has(id)) throw new Error(`${context}: duplicate resource id '${id}'`);
    ids.add(id);

    if(!Array.isArray(resource.tags)) throw new Error(`${context}: resource '${id}' tags must be an array`);
    if(!Array.isArray(resource.pdfs)) throw new Error(`${context}: resource '${id}' pdfs must be an array`);
    resource.pdfs.forEach((pdf, pdfIdx) => {
      if(!pdf || typeof pdf !== "object") throw new Error(`${context}: resource '${id}' pdf ${pdfIdx} must be an object`);
      if(!pdf.id) throw new Error(`${context}: resource '${id}' pdf ${pdfIdx} is missing id`);
      if(!pdf.path) throw new Error(`${context}: resource '${id}' pdf ${pdfIdx} is missing path`);
    });
    const resourceTagKeys = new Set();
    resource.tags.forEach(tag => {
      if(typeof tag !== "string" || tag !== tag.trim() || !tag){
        throw new Error(`${context}: resource '${id}' has invalid tag '${tag}'`);
      }
      const key = tag.toLowerCase();
      if(resourceTagKeys.has(key)){
        throw new Error(`${context}: resource '${id}' has duplicate tag '${tag}'`);
      }
      resourceTagKeys.add(key);
    });

    if(resource.verifiedOn != null && !isValidMMYY(resource.verifiedOn)){
      throw new Error(`${context}: resource '${id}' verifiedOn must be MM/YY or null`);
    }
  });

  const resourceIds = new Set(data.resources.map(r => String(r && r.id || "")));
  const badFavorite = favorites.find(id => !resourceIds.has(String(id || "")));
  if(badFavorite) throw new Error(`${context}: favorite '${badFavorite}' does not reference a valid resource`);
}

function safeRender(label = "render"){
  return safeCall(label, () => {
    if(DEBUG) assertInvariants(`${label} pre`);
    const result = render();
    if(DEBUG) assertInvariants(`${label} post`);
    return result;
  });
}

function safeRenderAdmin(label = "renderAdmin"){
  return safeCall(label, () => {
    if(DEBUG) assertInvariants(`${label} pre`);
    const result = renderAdmin();
    if(DEBUG) assertInvariants(`${label} post`);
    return result;
  });
}

        throw new Error("legacy pdf was not migrated into pdfs[]");
      }
      if(resource.pdfs[0].path !== "assets/forms/intake.pdf"){
        throw new Error("legacy pdf path was not preserved");
      }
      if(resource.pdfs[0].name !== "intake.pdf"){
        throw new Error(`expected filename label, got '${resource.pdfs[0].name}'`);
      }
      const once = JSON.stringify(resource.pdfs);
      normalizeResourcePDFs(resource);
      if(JSON.stringify(resource.pdfs) !== once){
        throw new Error("PDF normalization is not idempotent");
      }
    }
  });

  tests.push({
    name: "MULTIPLE PDF EXPORT KEYS",
    fn: () => {
      const keys = collectPDFPathsFromResources([{
        id:"multi-pdf",
        pdf:"assets/legacy.pdf",
        pdfs:[
          { id:"a", name:"A", path:"pdfs/multi/a-a.pdf" },
          { id:"b", name:"B", path:"pdfs/multi/b-b.pdf" },
          { id:"dup", name:"Dup", path:"assets/legacy.pdf" }
        ]
      }]);
      const expected = ["pdfs/multi/a-a.pdf", "pdfs/multi/b-b.pdf", "assets/legacy.pdf"];
      if(JSON.stringify(keys) !== JSON.stringify(expected)){
        throw new Error(`unexpected export keys: ${JSON.stringify(keys)}`);
      }
    }
  });

  tests.push({
    name: "MULTIPLE PDF BUTTON RENDERING",
    fn: () => {
      const card = buildResourceCard({
        id:"render-pdfs",
        name:"Render PDFs",
        pdfs:[
          { id:"one", name:"First form", path:"pdfs/render/one.pdf" },
          { id:"two", name:"Second form", path:"pdfs/render/two.pdf" }
        ],
        servicesText:"",
        tags:[]
      }, { expanded:true });
      const buttons = card.querySelectorAll(".resource-pdf-button");
      if(buttons.length !== 2) throw new Error(`expected 2 PDF buttons, got ${buttons.length}`);
      if(buttons[0].textContent !== "First form" || buttons[1].textContent !== "Second form"){
        throw new Error("PDF button labels were not rendered from attachment names");
      }
    }
  });

  tests.push({
    name: "REMOVE ONE PDF PRESERVES OTHERS",
    fn: () => {
      const resource = {
        id:"remove-pdf",
        pdfs:[
          { id:"one", name:"One", path:"pdfs/remove/one.pdf" },
          { id:"two", name:"Two", path:"pdfs/remove/two.pdf" }
        ]
      };
      const removed = removePDFAttachmentFromResource(resource, "one");
      if(!removed || removed.path !== "pdfs/remove/one.pdf"){
        throw new Error("target PDF was not removed");
      }
      if(resource.pdfs.length !== 1 || resource.pdfs[0].path !== "pdfs/remove/two.pdf"){
        throw new Error("unrelated PDF was removed");
      }
    }
  });

  const results = tests.map(test => {
    try{
      test.fn();
      return { ok:true, name:test.name, message:"" };
    }catch(err){
      return { ok:false, name:test.name, message:(err && err.message) ? err.message : String(err) };
    }
  });

  const panel = document.getElementById("selfTestPanel");
  const resultsEl = document.getElementById("selfTestResults");
  if(panel && resultsEl){
    resultsEl.innerHTML = "";
    results.forEach(result => {
      const row = document.createElement("div");
      row.textContent = result.ok
        ? `✔ PASS ${result.name}`
        : `✖ FAIL ${result.name}: ${result.message}`;
      resultsEl.appendChild(row);
    });
    panel.style.display = "block";
  }

  return results;
}

  };

function getUnseenUpdates(){

function getCategoryUpdateMap(){

  getUnseenUpdates().forEach(entry => {

  return map;
}

function buildResourceCard(res,{expanded=false,showDescription=false,showStar=true}={}){
  // Shared DOM builder used by category view, favorites view, and print previews.
  normalizeResourceServices(res);
  normalizeResourcePDFs(res);

  const card=document.createElement("div");
  card.className="resource-card";
  card.addEventListener("click", event => {
    handleAdminListReferenceInspection(event, res);
  }, true);

  if(showStar){
    const star=document.createElement("div");
    star.className="star"+(favorites.includes(res.id)?" fav":"");
    star.textContent="★";
    star.onclick=e=>{e.stopPropagation(); toggleFav(res.id);};
    card.appendChild(star);
  }

  const main=document.createElement("div");
  main.className="resource-main";
  main.innerHTML=`<strong>${res.name}</strong>`;
  if(showDescription && res.description) main.innerHTML+=`<div>${escapeHTML(res.description)}</div>`;

  const details=document.createElement("div");
  details.className="resource-details "+(expanded?"expanded":"collapsed");

  let html="";
  const pdfs = getResourcePDFs(res);
  const websiteURL = normalizeWebsiteURL(res.website);
  if(res.phone) html+=`<div><strong>Phone:</strong> <a href="tel:${res.phone}">${res.phone}</a></div>`;
  if(res.address) html+=`<div><strong>Address:</strong> ${escapeHTML(res.address)}</div>`;
  if(websiteURL) html+=`<div><strong>Website:</strong> <a href="${websiteURL}" target="_blank">${res.website}</a></div>`;
  if(pdfs.length === 1){
    const label = pdfs[0].name && pdfs[0].name !== "PDF" ? pdfs[0].name : "Open PDF";
    html+=`<div><button type="button" class="button resource-pdf-button" data-pdf-index="0">${escapeHTML(label)}</button></div>`;
  }
  if(pdfs.length > 1){
    html+=`<div><strong>PDFs:</strong><div class="pdf-attachments-list">`;
    pdfs.forEach((pdf, index) => {
      html+=`<button type="button" class="button resource-pdf-button" data-pdf-index="${index}">${escapeHTML(pdf.name || "PDF")}</button>`;
    });
    html+=`</div></div>`;
  }
  if(res.servicesText) html+=`<div><strong>Services:</strong><div class="services-rendered">${renderServicesHTML(res.servicesText)}</div></div>`;

  details.innerHTML=html;
  details.querySelectorAll(".resource-pdf-button").forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      const index = Number(btn.dataset.pdfIndex);
      const pdf = pdfs[index];
      if(pdf && pdf.path) await openPDF(pdf.path);
    };
  });
  main.appendChild(details);
  card.appendChild(main);
  return card;
}

function getCategoryFilterTags(categoryId){
  return Array.isArray(categoryTagFilters[categoryId]) ? categoryTagFilters[categoryId] : [];
}

function setCategoryFilterTags(categoryId, tags){
  const cleaned = normalizeResourceTags(tags);
  if(cleaned.length){
    categoryTagFilters[categoryId] = cleaned;
  }else{
    delete categoryTagFilters[categoryId];
  }
}

function clearAllCategoryFilters(shouldRender = true){
  categoryTagFilters = {};
  if(shouldRender && view === "category") safeRender();
}

function getResourceTagKeys(resource){
  return new Set(normalizeResourceTags(resource && resource.tags).map(tag => tag.toLowerCase()));
}

function countSelectedTagMatches(resource, activeTagKeys){
  if(!activeTagKeys.size) return 0;
  const resourceKeys = getResourceTagKeys(resource);
  let count = 0;
  activeTagKeys.forEach(key => {
    if(resourceKeys.has(key)) count += 1;
  });
  return count;
}

function resourceMatchesSelectedTags(resource, selectedTags){
  const activeTags = normalizeResourceTags(selectedTags);
  const activeTagKeys = new Set(activeTags.map(tag => tag.toLowerCase()));
  return !activeTagKeys.size || countSelectedTagMatches(resource, activeTagKeys) > 0;
}

function filterResourcesBySelectedTags(resources, selectedTags){
  const activeTags = normalizeResourceTags(selectedTags);
  const activeTagKeys = new Set(activeTags.map(tag => tag.toLowerCase()));
  return (Array.isArray(resources) ? resources : [])
    .filter(resource => resourceMatchesSelectedTags(resource, activeTags))
    .sort((a, b) => {
      if(activeTagKeys.size){
        const matchDiff = countSelectedTagMatches(b, activeTagKeys) - countSelectedTagMatches(a, activeTagKeys);
        if(matchDiff) return matchDiff;
      }
      return compareResourcesByName(a, b);
    });
}

function getCategoryResources(categoryId){
  return (Array.isArray(data.resources) ? data.resources : [])
    .filter(r => Array.isArray(r.categories) && r.categories.includes(categoryId));
}

function getTagsForCategory(categoryId){
  const tags = [];
  const seen = new Set();
  getCategoryResources(categoryId).forEach(resource => {
    normalizeResourceTags(resource.tags).forEach(tag => {
      const key = tag.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      tags.push(tag);
    });
  });
  return tags.sort((a,b)=>a.localeCompare(b, undefined, { sensitivity:"base" }));
}

function getCategoryTagOptions(categoryId){
  return getTagsForCategory(categoryId);
}

function getUndoSnapshot(){
  try{
    const raw = localStorage.getItem(UNDO_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return null;
    if(!parsed.dataSnapshot || typeof parsed.message !== "string") return null;
    return parsed;
  }catch(_err){
    return null;
  }
}

function clearUndoSnapshot(){
  localStorage.removeItem(UNDO_STORAGE_KEY);
}

function setUndoSnapshot(message){
  localStorage.setItem(UNDO_STORAGE_KEY, JSON.stringify({
    dataSnapshot: JSON.parse(JSON.stringify(data)),
    message: String(message || "")
  }));
}

function undoLastDeletion(){
  const snapshot = getUndoSnapshot();
  if(!snapshot || !snapshot.dataSnapshot) return;
      data = snapshot.dataSnapshot;
      normalizeDataServicesShape(data);
      normalizeDataPDFShape(data);
      normalizeDataTagsShape(data);
      normalizeDataVerifiedOnShape(data);
      normalizeChanges(data);
  clearUndoSnapshot();
  persist();
  safeRender();
}

/* ---------- Print ---------- */

// PrintWorkflow is a small queue-based state machine for print preview/packet flow.
// Each queue entry has a label and render function so print steps stay data-driven.
const PrintWorkflow = {
  queue: [],
  currentIndex: -1,
  initiatedByButton: false,

  isListResource(res){
    if(!Array.isArray(res?.tags)) return false;
    return res.tags.some(tag => {
      return canonicalizeResourceTag(tag).toLowerCase() === "list";
    });
  },

  getFavoriteGroups(){
    // "List" resources are separated so favorites packet output can render flyers.
    const normalFavs = [];
    const listFavs = [];

    data.resources.filter(r=>favorites.includes(r.id)).forEach(res => {
      if(this.isListResource(res)){
        listFavs.push(res);
      }else{
        normalFavs.push(res);
      }
    });

    return { normalFavs, listFavs };
  },

  buildQueue(){
    const { normalFavs, listFavs } = this.getFavoriteGroups();
    if(!normalFavs.length && !listFavs.length) return [];
    if(!listFavs.length){
      return [{
        label:"Favorites",
        render: () => this.renderFavorites()
      }];
    }
    return [{
      label:"Favorites",
      render: () => this.renderFavoritesPacket()
    }];
  },

  updateUI(){
    const active = this.queue.length > 0 && this.currentIndex >= 0 && this.currentIndex < this.queue.length;
    const isLastStep = active && this.currentIndex === this.queue.length - 1;
    printCloseBtn.classList.toggle("hidden", active && !isLastStep);
    printNextBtn.classList.toggle("hidden", !active || isLastStep);
    if(!active){
      printProgress.textContent = "";
      return;
    }
    const step = this.queue[this.currentIndex];
    printProgress.textContent = `Printing ${this.currentIndex + 1} of ${this.queue.length}: ${step.label}. Use double-sided printing in the print dialog.`;
  },

  showStep(){
    const step = this.queue[this.currentIndex];
    if(!step || typeof step.render !== "function") return;
    step.render();
  },

  openPreviewContent(render){
    this.updateUI();
    printContent.innerHTML="";
    if(typeof render === "function") render(printContent);
    printModal.classList.remove("hidden");
  },

  openPreview(resources){
    this.openPreviewContent(container => {
      container.innerHTML="<h2>Suggested Resources</h2>";
      this.renderPrintableResourceCards(container, resources);
    });
  },

  renderPrintableResourceCards(container, resources){
    (Array.isArray(resources) ? resources : []).forEach((res, index)=>{
      if(index > 0){
        const separator = document.createElement("hr");
        separator.className = "print-resource-separator";
        container.appendChild(separator);
      }
      const card=buildResourceCard(res,{expanded:true,showStar:false});
      container.appendChild(card);
    });
  },

  renderFavorites(){
    const { normalFavs } = this.getFavoriteGroups();
    this.openPreview(normalFavs);
  },

  buildListFlyer(resource, shouldPageBreak){
    const flyer = document.createElement("section");
    flyer.className = "print-list-flyer" + (shouldPageBreak ? " print-list-flyer-page-break" : "");

    let html = `<h2>${escapeHTML(resource.name || "")}</h2>`;
    if(resource.phone) html += `<div class="print-list-field"><strong>Phone:</strong> ${escapeHTML(resource.phone)}</div>`;
    if(resource.address) html += `<div class="print-list-field"><strong>Address:</strong> ${escapeHTML(resource.address)}</div>`;
    if(resource.website) html += `<div class="print-list-field"><strong>Website:</strong> ${escapeHTML(resource.website)}</div>`;
    if(resource.servicesText){
      html += `<div class="print-list-field"><strong>Services:</strong><div class="services-rendered">${renderServicesHTML(resource.servicesText)}</div></div>`;
    }
    flyer.innerHTML = html;
    return flyer;
  },

  renderFavoritesPacket(){
    const { normalFavs, listFavs } = this.getFavoriteGroups();
    this.openPreviewContent(container => {
      if(normalFavs.length){
        container.innerHTML = "<h2>Suggested Resources</h2>";
        this.renderPrintableResourceCards(container, normalFavs);
      }

      listFavs.forEach((resource, index) => {
        container.appendChild(this.buildListFlyer(resource, normalFavs.length > 0 || index > 0));
      });
    });
  },

  renderSingleListResource(resourceId){
    const { listFavs } = this.getFavoriteGroups();
    const resource = listFavs.find(res => res.id === resourceId);
    if(!resource) return;
    this.openPreview([resource]);
  },

  startFavoritesPacket(){
    this.queue = this.buildQueue();
    if(!this.queue.length) return;
    this.currentIndex = 0;
    this.showStep();
  },

  next(){
    if(this.currentIndex >= this.queue.length - 1) return this.close();
    this.currentIndex += 1;
    this.showStep();
  },

  close(){
    this.queue = [];
    this.currentIndex = -1;
    this.updateUI();
    printModal.classList.add("hidden");
  },

  doPrint(){
    this.initiatedByButton = true;
    window.print();
    clearAllCategoryFilters(false);
  },

  handleAfterPrint(){
